<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Showtime Fit</title>
<meta name="theme-color" content="#140B24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Showtime Fit">
<link rel="apple-touch-icon" href="icon180.png?v=3">
<link rel="icon" type="image/png" href="icon192.png?v=3">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#140B24;--card:#22143B;--card2:#2E1C4F;--pur:#552583;--pur2:#7B4BB7;--gold:#FDB927;--gold2:#F3CF73;--tx:#F3EEFB;--mu:#B4A6CF;--dim:#8A7AAA;--ok:#97C459;--bad:#F09595;--line:#3A2860;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Barlow,system-ui,sans-serif;font-size:15px;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{overflow:hidden;position:fixed;inset:0}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(14px + var(--st)) 16px 24px;overscroll-behavior:contain}
.tabs{display:flex;justify-content:space-around;background:#1B0F2E;border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sb))}
.tabs button{flex:1;background:none;border:0;color:var(--dim);font:500 11px Barlow,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--gold)}
h1{font:700 30px/1.05 'Barlow Condensed',sans-serif;margin:2px 0 12px;letter-spacing:.3px}
h2{font:700 21px 'Barlow Condensed',sans-serif;margin:20px 0 10px;letter-spacing:.3px}
h3{font:600 17px Barlow,sans-serif;margin:0 0 4px}
.mu{color:var(--mu)}.dim{color:var(--dim)}.small{font-size:13px}.gold{color:var(--gold)}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{background:var(--pur);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card2);color:var(--mu);border:0;border-radius:20px;padding:8px 13px;font:500 14px Barlow,sans-serif;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--gold);color:#2A1A47}
.chip.wh.on{background:#fff;color:var(--pur)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px;font:700 18px 'Barlow Condensed',sans-serif;letter-spacing:.5px;background:var(--gold);color:#2A1A47}
.btn.sec{background:var(--card2);color:var(--tx);font:600 16px Barlow,sans-serif}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--tx);font:600 15px Barlow,sans-serif}
.btn.danger{background:#5A1A2A;color:#FFD6D6;font:600 15px Barlow,sans-serif}
.btn svg{width:20px;height:20px}
.ic{width:20px;height:20px;flex:none}
.tile{background:var(--card);border-radius:14px;padding:12px;border:0;color:var(--tx);text-align:left;font:inherit}
.tile .ic{color:var(--gold)}
.stat{background:var(--card);border-radius:12px;padding:12px}
.stat b{display:block;font:700 26px 'Barlow Condensed',sans-serif;color:var(--gold)}
input,select,textarea{font:500 16px Barlow,sans-serif;background:#1B0F2E;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--pur2);border-color:transparent}
label{font-size:13px;color:var(--mu);display:block;margin:10px 0 4px}
.fig{display:block;width:100%;height:auto}
.figbox{background:var(--card2);border-radius:14px;overflow:hidden}
.ok{background:#1D3410;color:#CFE8A9;border-radius:10px;padding:8px 10px;margin:6px 0;display:flex;gap:8px;font-size:14px}
.err{background:#3A1020;color:#F7C1C1;border-radius:10px;padding:8px 10px;margin:6px 0;display:flex;gap:8px;font-size:14px}
.ok svg,.err svg{width:18px;height:18px;flex:none;margin-top:1px}
.star{background:none;border:0;color:var(--dim);padding:8px;flex:none}.star.on{color:var(--gold)}.star svg{width:22px;height:22px}
.list-ex{cursor:pointer;display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:8px;margin-bottom:8px;border:0;color:var(--tx);width:100%;text-align:left;font:inherit}
.list-ex .th{width:92px;flex:none;background:var(--card2);border-radius:10px}
.tag{font-size:11px;background:var(--card2);color:var(--mu);border-radius:8px;padding:2px 7px;display:inline-block;margin:2px 4px 0 0}
.tag.g{background:#4A3A12;color:var(--gold2)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,4,20,.72);z-index:70;display:flex;align-items:flex-end;animation:fade .15s}
.sheet{position:relative;background:#1B0F2E;border-radius:22px 22px 0 0;width:100%;max-height:92%;overflow-y:auto;padding:18px 16px calc(20px + var(--sb));animation:up .2s ease-out;overscroll-behavior:contain}
.sx{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:var(--card2);color:var(--tx);display:flex;align-items:center;justify-content:center;z-index:2}.sx svg{width:20px;height:20px}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.5}}@keyframes fade{from{opacity:0}}
.player{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:calc(10px + var(--st)) 16px calc(14px + var(--sb))}
.pbar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.timer{font:700 64px/1 'Barlow Condensed',sans-serif;text-align:center;color:#fff;font-variant-numeric:tabular-nums}
.ctrl{display:flex;gap:10px;justify-content:center;align-items:center}
.ctrl button{background:var(--card2);border:0;color:#fff;border-radius:50%;width:56px;height:56px;display:flex;align-items:center;justify-content:center}
.ctrl button.big{width:72px;height:72px;background:var(--gold);color:#2A1A47}
.ctrl svg{width:26px;height:26px}
.cue{background:var(--pur);border-radius:12px;padding:10px 12px;text-align:center;font-weight:500;min-height:44px}
.dayrow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.dayrow.today{outline:2px solid var(--gold)}
.dname{width:44px;text-align:center}.dname b{display:block;font:700 20px 'Barlow Condensed',sans-serif}
.ball{width:42px;height:42px;border-radius:50%;border:0;background:var(--card2);color:var(--dim);display:flex;align-items:center;justify-content:center;flex:none}
.ball.on{background:#fff;color:var(--pur)}
.medal{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px}
.medal .md{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card2);color:var(--dim);flex:none}
.medal.got .md{background:var(--gold);color:#2A1A47}
.medal:not(.got){opacity:.6}
.toast{position:fixed;left:16px;right:16px;bottom:calc(90px + var(--sb));background:var(--gold);color:#2A1A47;border-radius:14px;padding:12px 14px;font-weight:600;z-index:80;animation:up .2s}
.num{display:flex;align-items:center;gap:8px}.num button{width:44px;height:44px;border-radius:12px;border:0;background:var(--card2);color:#fff;font:700 22px Barlow,sans-serif;flex:none}.num input{text-align:center;font-weight:600;font-size:20px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border:0}
#mlines line{display:none}
.mcard{background:var(--card);border:0;border-radius:12px;padding:10px 12px;text-align:left;color:var(--tx);display:flex;flex-direction:column;gap:2px;min-width:0;font:inherit}.mcard b{font:700 22px/1.1 'Barlow Condensed',sans-serif;white-space:nowrap}.mcard.sel{outline:2px solid var(--gold)}.mcard .dl{font-size:12px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block}
.logo{display:flex;align-items:center;gap:12px}.logo svg{width:52px;height:52px;border-radius:12px}
.hint{font-size:12px;color:var(--dim);margin-top:4px}
.empty{color:var(--dim);text-align:center;padding:16px 8px;font-size:14px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px}.seg button{flex:1;border:0;background:none;color:var(--mu);padding:9px 4px;border-radius:9px;font:600 14px Barlow,sans-serif}.seg button.on{background:var(--gold);color:#2A1A47}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu);margin:8px 2px}.legend i{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:5px;vertical-align:-1px}
</style>
</head>

function phaseSets(n,ph){if(ph.k==='base')return Math.min(n,3);if(ph.k==='scarico')return Math.max(2,Math.ceil(n/2));if(ph.k==='spinta')return Math.min(4,n+1);return n}
function isCalcio(d){if(SP().none)return false;const w=S.calW[monday(d)]||[];return w.includes(dIdx(d))||S.calLog.some(c=>c.date===d)}
function planFor(d){
 {const pw=planWeek(monday(d))[d];if(pw)return pw}
 if(isCalcio(d))return{focus:'pre',why:'Oggi '+SP().w+': fai solo l\'attivazione prima del calcio'};
 if(isCalcio(addD(d,1)))return{focus:'massa',why:'Domani '+SP().w+': massa solo parte alta'};
 if(isCalcio(addD(d,-1)))return{focus:'mobilita',why:'Ieri '+SP().w+': recupero e mobilità'};
 const mon=monday(d);let k=0;for(let i=0;i<dIdx(d);i++){const x=addD(mon,i);if(!isCalcio(x)&&!isCalcio(addD(x,1))&&!isCalcio(addD(x,-1)))k++}
 const wn=Math.floor(diffD('2024-01-01',mon)/7);if(k%2===0)return{focus:'massa',why:'Giorno libero: si costruisce muscolo'};return{focus:ROT[(Math.floor(k/2)+wn)%ROT.length],why:'Giorno libero: condizione fisica'};
}
const ZONES=[['ginocchio','Ginocchio'],['caviglia','Caviglia'],['anca','Anca / inguine'],['schiena','Schiena bassa'],['spalla','Spalla'],['polso','Polso / gomito'],['collo','Collo']];
const ZLOAD={ginocchio:['squat','squatpausa','affondo','bulgaro','pistol','jumpsquat','wallsit','skip','nordic','flessori','climber'],caviglia:['skip','jumpsquat','calf','climber','affondo','pistol','polpacci','bulgaro'],anca:['affondo','bulgaro','pistol','jumpsquat','climber','flessori','skip'],schiena:['hinge','rowzaino','superman','estensione','jumpsquat','cobra','yraise','nordic'],spalla:['pushup','pushknee','pushfeet','pushdiamond','pusharcher','dip','pressz','pullup','pullneg','climber','circ','yraise'],polso:['pushup','pushknee','pushfeet','pushdiamond','pusharcher','dip','birddog','catcow','climber','cobra','plank'],collo:['pullup','pullneg']};
function painOn(){return ZONES.filter(z=>S.pain&&S.pain[z[0]])}
function blocked(e){return !!e&&painOn().some(z=>(ZLOAD[z[0]]||[]).includes(e.id))}
function blockedBy(e){return painOn().filter(z=>(ZLOAD[z[0]]||[]).includes(e.id)).map(z=>z[1].toLowerCase())}
function okEx(e,eq){return e.req.every(r=>eq.includes(r))&&level()>=e.lv[0]&&level()<=e.lv[1]&&!blocked(e)}
function workAmt(e){const pf=PF[progWeek()-1];const b=e.base[level()-1];const v=Math.max(e.mode==='reps'?2:15,Math.round(b*pf/(e.mode==='time'?5:1))*(e.mode==='time'?5:1));return v}
function workSecs(e){const a=workAmt(e);return (e.mode==='reps'?Math.round(a*tempoOf(e)):a)*(e.side?2:1)}
function buildWorkout(focus,D,loc){
 if(FOCUS[focus]&&FOCUS[focus].sess)return buildSession(FOCUS[focus].sess,D,loc);
 if(focus==='massa')return buildMass(D,loc);
 const eq=LOCS[loc].eq,r=seeded(today()+focus+loc+D);
 const F=FOCUS[focus];const steps=[];
 const nW={10:3,20:4,30:5,45:6,60:6}[D]||4,nC={10:2,20:3,30:3,45:4,60:5}[D]||3;
 let warm=WARM.map(i=>EXM[i]).filter(e=>okEx(e,eq)).slice(0,nW);
 let cool=COOL.map(i=>EXM[i]).filter(e=>okEx(e,eq));
 if(cool.some(e=>e.id==='flessori'))cool=cool.filter(e=>e.id!=='flessinpiedi');cool=cool.slice(0,nC);
 const push=(e,secs,label,phase,reps)=>steps.push({type:'work',ex:e,secs,label,phase,reps});
 const sw=e=>steps.push({type:'switch',ex:e,secs:6});
 if(F.fixed){const list=F.fixed.map(i=>EXM[i]).filter(e=>okEx(e,eq)||e.req.every(r=>eq.includes(r)));const per=Math.max(30,Math.round((D*60)/list.length)-6);list.forEach((e,i)=>{sw(e);push(e,e.side?per:per,'Attivazione · '+(i+1)+'/'+list.length,'warm')});return steps}
 const wS=e=>e.side?50:35,cS=e=>e.side?50:35;
 warm.forEach((e,i)=>{sw(e);push(e,wS(e),'Riscaldamento · '+(i+1)+'/'+warm.length,'warm')});
 let pool=F.pool.map(i=>EXM[i]).filter(e=>okEx(e,eq));
 if(!pool.length)pool=FOCUS.calcio.pool.map(i=>EXM[i]).filter(e=>okEx(e,eq));
 pool=shuffle(pool,r);
 const E=Math.min(pool.length,{10:3,20:4,30:5,45:6,60:7}[D]||4);const main=pool.slice(0,E);
 const used=warm.reduce((a,e)=>a+wS(e)+6,0)+cool.reduce((a,e)=>a+cS(e)+6,0);
 const M=D*60-used;const rest=F.mob?8:[35,30,25][level()-1];
 const round=main.reduce((a,e)=>a+(F.mob?40*(e.side?2:1):workSecs(e))+rest,0)+(F.mob?0:30);
 const rounds=clamp(Math.round(M/round),1,5);
 for(let g=1;g<=rounds;g++){main.forEach((e,i)=>{
   const secs=F.mob?40*(e.side?2:1):workSecs(e);
   steps.push({type:'rest',secs:(g===1&&i===0)?8:rest,ex:e});
   push(e,secs,(F.mob?'Mobilità':'Circuito')+' · giro '+g+'/'+rounds,'main',(!F.mob&&e.mode==='reps')?workAmt(e):0)});
   if(g<rounds&&!F.mob)steps.push({type:'rest',secs:30,ex:main[0],round:true})}
 cool.forEach((e,i)=>{sw(e);push(e,cS(e),'Defaticamento · '+(i+1)+'/'+cool.length,'cool')});
 return steps;
}

function weekSets(mon=monday(today())){const o=Object.fromEntries(MUSG.map(m=>[m[0],0]));const GM={petto:'petto',schiena:'schiena',spalle:'spalle',bicipiti:'braccia',tricipiti:'braccia',addome:'addome',gambe:'gambe',glutei:'gambe',polpacci:'gambe'};S.mass.log.filter(l=>monday(l.date)===mon).forEach(l=>{const sl=MASS.find(x=>x.id===l.slot);if(sl)o[sl.mus]+=l.reps.length;else if(EXM[l.ex]){const g=GM[groupsOf(EXM[l.ex])[0]];if(g)o[g]+=l.reps.length}});return o}
function slotLvl(sl){if(S.mass.lv[sl.id]!=null)return S.mass.lv[sl.id];if(sl.id==='petto'||sl.id==='petto2')return [0,1,2][level()-1];if(sl.id==='squat')return level()===3?1:0;if(sl.id==='trazioni')return level()===3?1:0;return 0}
function slotEx(sl,eq){if((sl.req||[]).some(r=>!eq.includes(r)))return null;const lv=Math.min(slotLvl(sl),sl.lad.length-1);for(let i=lv;i>=0;i--){const e=EXM[sl.lad[i]];if(e.req.every(r=>eq.includes(r))&&!blocked(e))return{ex:e,lvl:i}}return null}
function lastLog(slot,exid){for(let i=S.mass.log.length-1;i>=0;i--){const l=S.mass.log[i];if(l.slot===slot&&l.ex===exid)return l}return null}
function lastSlotDate(slot){for(let i=S.mass.log.length-1;i>=0;i--)if(S.mass.log[i].slot===slot)return S.mass.log[i].date;return ''}
function noLegsToday(){return SP().legs&&(isCalcio(today())||isCalcio(addD(today(),1)))}
function pickSlots(D,loc){
 const eq=LOCS[loc].eq,n={10:2,20:3,30:4,45:5,60:6}[D]||3,noLegs=noLegsToday();
 const ws=weekSets();const cand=MASS.filter(sl=>!(noLegs&&sl.legs)).map(sl=>({sl,...(slotEx(sl,eq)||{})})).filter(c=>c.ex);
 const out=[],per={};
 while(out.length<n){
  const left=cand.filter(c=>!out.includes(c)&&(per[c.sl.mus]||0)<2&&!(c.sl.id==='remelast'&&out.some(o=>o.sl.id==='rematore'))&&!(c.sl.id==='rematore'&&out.some(o=>o.sl.id==='remelast'))&&!(c.sl.id==='polpacci'&&out.length<n-1));
  if(!left.length)break;
  left.sort((a,b)=>(ws[a.sl.mus]+(per[a.sl.mus]||0)*3)-(ws[b.sl.mus]+(per[b.sl.mus]||0)*3)||lastSlotDate(a.sl.id).localeCompare(lastSlotDate(b.sl.id))||MASS.indexOf(a.sl)-MASS.indexOf(b.sl));
  const c=left[0];out.push(c);per[c.sl.mus]=(per[c.sl.mus]||0)+1;
 }

 const days=[...Array(7)].map((_,i)=>addD(mon,i)),t=today();const dd=sessDone(mon);const doneSet=new Set(Object.values(dd));

 const k=Math.min(rem.length,free.length);
 const combos=(arr,n,st=0,cur=[],out=[])=>{if(cur.length===n){out.push(cur.slice());return out}for(let i=st;i<arr.length;i++){cur.push(arr[i]);combos(arr,n,i+1,cur,out);cur.pop()}return out};

 for(const dset of combos(free,k)){for(const pr of perms(rem.length>k?rem:sessList)){const ass=pr.slice(0,k);let sc=0;
   ass.forEach((x,i)=>{const d=dset[i];const nx=isCalcio(addD(d,1)),pv=isCalcio(addD(d,-1));

   for(let i=1;i<k;i++)if(diffD(dset[i-1],dset[i])===1)sc-=2;
   for(let i=1;i<k;i++)if(ass[i-1]<ass[i])sc+=0.5;
   if(sc>bs){bs=sc;best={dset,ass}}}}

 days.forEach(d=>{

  if(isCalcio(d)){res[d]={focus:'pre',why:'Oggi '+SP().w+': solo attivazione prima',calcio:true};return}

 });

}

function eqPicker(sel){return `<div style="display:flex;flex-direction:column;gap:8px">${EQ.map(([k,n,d])=>`<button class="card row eqb ${sel.includes(k)?'on':''}" data-eq="${k}" style="margin:0;width:100%;border:0;color:var(--tx);text-align:left;padding:11px 12px;${sel.includes(k)?'outline:2px solid var(--gold)':''}"><span style="width:26px;height:26px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:${sel.includes(k)?'var(--gold)':'var(--card2)'};color:#2A1A47">${sel.includes(k)?I('check'):''}</span><div style="flex:1"><b>${n}</b><div class="small dim">${d}</div></div></button>`).join('')}</div>`}
function bindEq(root,sel,redraw){root.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{const k=b.dataset.eq;const i=sel.indexOf(k);i<0?sel.push(k):sel.splice(i,1);redraw()})}

function planMin(items){return Math.round(items.reduce((a,[id,sets,amt,rest])=>{const e=EXM[id];if(!e)return a;const w=e.mode==='reps'?amt*tempoOf(e)*(e.side?2:1):amt*(e.side?2:1);return a+sets*(w+rest)},120)/60)}

function buildPlan(pl){const eq=LOCS[S.loc].eq,steps=[],skipped=[];
 let wu=['skip','circ','rematore','hinge'].map(i=>EXM[i]).filter(e=>!blocked(e)).slice(0,2);if(pl.items.every(([id])=>groupsOf(EXM[id]||{id:''}).includes('mobilita')))wu=[];
 wu.forEach((e,i)=>{steps.push({type:'switch',ex:e,secs:5});steps.push({type:'work',ex:e,secs:30,label:'Riscaldamento · '+(i+1)+'/'+wu.length,phase:'warm'})});
 pl.items.forEach(([id,sets,amt,rest])=>{const e=EXM[id];if(!e)return;if(!e.req.every(r=>eq.includes(r))||blocked(e)){skipped.push(e.n);return}
  const kg=e.bag==='hand'?3:0;const ll=lastLog('x-'+e.id,e.id);
  for(let k=1;k<=sets;k++){steps.push({type:'rest',secs:k===1?10:rest,ex:e,kg});
   if(e.mode==='reps')steps.push({type:'set',ex:e,slot:'x-'+e.id,sn:e.n,setNo:k,sets,kg,lvl:0,nl:1,fixed:true,range:[Math.max(1,amt-3),amt],prog:false,last:ll&&ll.reps[k-1]!=null?ll.reps[k-1]:null,secs:45,phase:'main'});
   else steps.push({type:'work',ex:e,secs:amt*(e.side?2:1),label:e.n+' · serie '+k+'/'+sets,phase:'main'})}});
 return{steps,skipped}}

function shrink(file){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,900/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);try{r(c.toDataURL('image/jpeg',0.75))}catch(e){r(null)}};img.onerror=()=>r(null);img.src=fr.result};fr.onerror=()=>r(null);fr.readAsDataURL(file)})}

  el.querySelector('#bfin').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=async()=>{try{let o=JSON.parse(fr.result);const ph=o.photos;if(o.app==='showtimefit')o=o.S;if(!o||!o.name)throw 0;S={...DEF(),...o};migrateLocs();save();if(ph&&ph.length){for(const x of ph)await IDB.put(x)}close();render();toast('Backup ripristinato'+(ph&&ph.length?' con '+ph.length+' foto':''))}catch(e){toast('File di backup non valido')}};fr.readAsText(f)};
  el.querySelector('#bcopy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S));toast('Backup copiato: incollalo in una nota per conservarlo')}catch(e){toast('Copia non riuscita su questo browser')}};
  el.querySelector('#bimp').onclick=()=>{close();importSheet()};
  el.querySelector('#ssave').onclick=()=>{const n=el.querySelector('#sn').value.trim();if(n)S.name=n;S.level=lv;S.sex=sx;save();close();render();toast('Impostazioni salvate')};
  el.querySelector('#sreset').onclick=()=>{close();confirmBox('Cancellare tutti i dati? Non si può annullare.','Cancella tutto',()=>{S=DEF();save();render()})};
 });
