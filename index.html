<!DOCTYPE html>
<html lang="it">

<style>
:root{--bg:#140B24;--card:#22143B;--card2:#2E1C4F;--pur:#552583;--pur2:#7B4BB7;--gold:#FDB927;--gold2:#F3CF73;--tx:#F3EEFB;--mu:#B4A6CF;--dim:#8A7AAA;--ok:#97C459;--bad:#F09595;--line:#3A2860;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Barlow,system-ui,sans-serif;font-size:15px;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{overflow:hidden;position:fixed;inset:0}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(14px + var(--st)) 16px 24px;overscroll-behavior:contain}
.tabs{display:flex;justify-content:space-around;background:#1B0F2E;border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sb))}
.tabs button{flex:1;background:none;border:0;color:var(--dim);font:500 11px Barlow,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--gold)}
h1{font:700 30px/1.05 'Barlow Condensed',sans-serif;margin:2px 0 12px;letter-spacing:.3px}
h2{font:700 21px 'Barlow Condensed',sans-serif;margin:20px 0 10px;letter-spacing:.3px}
h3{font:600 17px Barlow,sans-serif;margin:0 0 4px}
.mu{color:var(--mu)}.dim{color:var(--dim)}.small{font-size:13px}.gold{color:var(--gold)}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{background:var(--pur);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card2);color:var(--mu);border:0;border-radius:20px;padding:8px 13px;font:500 14px Barlow,sans-serif;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--gold);color:#2A1A47}
.chip.wh.on{background:#fff;color:var(--pur)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px;font:700 18px 'Barlow Condensed',sans-serif;letter-spacing:.5px;background:var(--gold);color:#2A1A47}
.btn.sec{background:var(--card2);color:var(--tx);font:600 16px Barlow,sans-serif}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--tx);font:600 15px Barlow,sans-serif}
.btn.danger{background:#5A1A2A;color:#FFD6D6;font:600 15px Barlow,sans-serif}
.btn svg{width:20px;height:20px}
.ic{width:20px;height:20px;flex:none}
.tile{background:var(--card);border-radius:14px;padding:12px;border:0;color:var(--tx);text-align:left;font:inherit}
.tile .ic{color:var(--gold)}
.stat{background:var(--card);border-radius:12px;padding:12px}
.stat b{display:block;font:700 26px 'Barlow Condensed',sans-serif;color:var(--gold)}
input,select,textarea{font:500 16px Barlow,sans-serif;background:#1B0F2E;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--pur2);border-color:transparent}
label{font-size:13px;color:var(--mu);display:block;margin:10px 0 4px}
.fig{display:block;width:100%;height:auto}
.figbox{background:var(--card2);border-radius:14px;overflow:hidden}
.ok{background:#1D3410;color:#CFE8A9;border-radius:10px;padding:8px 10px;margin:6px 0;display:flex;gap:8px;font-size:14px}
.err{background:#3A1020;color:#F7C1C1;border-radius:10px;padding:8px 10px;margin:6px 0;display:flex;gap:8px;font-size:14px}
.ok svg,.err svg{width:18px;height:18px;flex:none;margin-top:1px}
.list-ex{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:8px;margin-bottom:8px;border:0;color:var(--tx);width:100%;text-align:left;font:inherit}
.list-ex .th{width:92px;flex:none;background:var(--card2);border-radius:10px}
.tag{font-size:11px;background:var(--card2);color:var(--mu);border-radius:8px;padding:2px 7px;display:inline-block;margin:2px 4px 0 0}
.tag.g{background:#4A3A12;color:var(--gold2)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,4,20,.72);z-index:70;display:flex;align-items:flex-end;animation:fade .15s}
.sheet{position:relative;background:#1B0F2E;border-radius:22px 22px 0 0;width:100%;max-height:92%;overflow-y:auto;padding:18px 16px calc(20px + var(--sb));animation:up .2s ease-out;overscroll-behavior:contain}
.sx{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:var(--card2);color:var(--tx);display:flex;align-items:center;justify-content:center;z-index:2}.sx svg{width:20px;height:20px}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.5}}@keyframes fade{from{opacity:0}}
.player{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:calc(10px + var(--st)) 16px calc(14px + var(--sb))}
.pbar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.timer{font:700 64px/1 'Barlow Condensed',sans-serif;text-align:center;color:#fff;font-variant-numeric:tabular-nums}
.ctrl{display:flex;gap:10px;justify-content:center;align-items:center}
.ctrl button{background:var(--card2);border:0;color:#fff;border-radius:50%;width:56px;height:56px;display:flex;align-items:center;justify-content:center}
.ctrl button.big{width:72px;height:72px;background:var(--gold);color:#2A1A47}
.ctrl svg{width:26px;height:26px}
.cue{background:var(--pur);border-radius:12px;padding:10px 12px;text-align:center;font-weight:500;min-height:44px}
.dayrow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.dayrow.today{outline:2px solid var(--gold)}
.dname{width:44px;text-align:center}.dname b{display:block;font:700 20px 'Barlow Condensed',sans-serif}
.ball{width:42px;height:42px;border-radius:50%;border:0;background:var(--card2);color:var(--dim);display:flex;align-items:center;justify-content:center;flex:none}
.ball.on{background:#fff;color:var(--pur)}
.medal{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px}
.medal .md{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card2);color:var(--dim);flex:none}
.medal.got .md{background:var(--gold);color:#2A1A47}
.medal:not(.got){opacity:.6}
.toast{position:fixed;left:16px;right:16px;bottom:calc(90px + var(--sb));background:var(--gold);color:#2A1A47;border-radius:14px;padding:12px 14px;font-weight:600;z-index:80;animation:up .2s}
.num{display:flex;align-items:center;gap:8px}.num button{width:44px;height:44px;border-radius:12px;border:0;background:var(--card2);color:#fff;font:700 22px Barlow,sans-serif;flex:none}.num input{text-align:center;font-weight:600;font-size:20px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border:0}
#mlines line{display:none}
.mcard{background:var(--card);border:0;border-radius:12px;padding:10px 12px;text-align:left;color:var(--tx);display:flex;flex-direction:column;gap:2px;min-width:0;font:inherit}.mcard b{font:700 22px/1.1 'Barlow Condensed',sans-serif;white-space:nowrap}.mcard.sel{outline:2px solid var(--gold)}.mcard .dl{font-size:12px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block}
.logo{display:flex;align-items:center;gap:12px}.logo svg{width:52px;height:52px;border-radius:12px}
.hint{font-size:12px;color:var(--dim);margin-top:4px}
.empty{color:var(--dim);text-align:center;padding:16px 8px;font-size:14px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px}.seg button{flex:1;border:0;background:none;color:var(--mu);padding:9px 4px;border-radius:9px;font:600 14px Barlow,sans-serif}.seg button.on{background:var(--gold);color:#2A1A47}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu);margin:8px 2px}.legend i{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:5px;vertical-align:-1px}
</style>
</head>

/* ---------- motore omino ---------- */
const R=Math.PI/180;
const LEN={ua:17,fa:15,th:20,sh:19,ft:7};
const dv=a=>[Math.cos(a*R),Math.sin(a*R)];
const lerp=(a,b,s)=>a+(b-a)*s;
function ikSolve(Pt,T,a,b,pref){
  const dx=T[0]-Pt[0],dy=T[1]-Pt[1];let d=Math.hypot(dx,dy);const base=Math.atan2(dy,dx);
  d=clamp(d,Math.abs(a-b)+0.01,a+b-0.01);
  const A=Math.acos(clamp((a*a+d*d-b*b)/(2*a*d),-1,1));
  const T2=[Pt[0]+d*Math.cos(base),Pt[1]+d*Math.sin(base)];
  const mx=(Pt[0]+T2[0])/2,my=(Pt[1]+T2[1])/2;let best=null,bs=-1e9;

  return [Math.atan2(best[1]-Pt[1],best[0]-Pt[0])/R,Math.atan2(T2[1]-best[1],T2[0]-best[0])/R];
}

 {const pw=planWeek(monday(d))[d];if(pw)return pw}

  const left=cand.filter(c=>!out.includes(c)&&(per[c.sl.mus]||0)<2&&!(c.sl.id==='remelast'&&out.some(o=>o.sl.id==='rematore'))&&!(c.sl.id==='rematore'&&out.some(o=>o.sl.id==='remelast'))&&!(c.sl.id==='polpacci'&&out.length<n-1));

function buildSession(L,D,loc){
 const eq=LOCS[loc].eq,ss=SESS[L],ph=phaseOf(),steps=[];const noLegs=noLegsToday();
 ['skip','circ','rematore'].map(i=>EXM[i]).forEach((e,i)=>{steps.push({type:'switch',ex:e,secs:5});steps.push({type:'work',ex:e,secs:30,label:'Riscaldamento · '+(i+1)+'/3',phase:'warm'})});
 if(ss.speed&&D>=20&&!noLegs){const j=level()>=2?EXM.jumpsquat:EXM.climber;
  steps.push({type:'switch',ex:EXM.skip,secs:5});for(let k=1;k<=2;k++){steps.push({type:'work',ex:EXM.skip,secs:20,label:'Velocità · skip '+k+'/2',phase:'main'});steps.push({type:'rest',secs:30,ex:k<2?EXM.skip:j})}
  for(let k=1;k<=3;k++){steps.push({type:'work',ex:j,secs:j.id==='jumpsquat'?9:20,reps:j.id==='jumpsquat'?5:0,label:'Velocità · '+j.n+' '+k+'/3',phase:'main'});if(k<3)steps.push({type:'rest',secs:40,ex:j})}}
 let items=ss.items.filter(it=>!(noLegs&&it.legs));
 if(D<=10)items=items.slice(0,2).map(it=>({...it,sets:2}));
 else if(D<=20)items=[...items.slice(0,3),...items.slice(3).filter(it=>it.slot==='addome'||it.time).slice(-1)];
 else if(D>=45)items=items.map((it,i)=>i<2?{...it,sets:it.sets+1}:it);
 items.forEach(it=>{
  let ex=null,sl=null,lvl=0,nl=1,fixed=false;
  if(it.time){ex=EXM[it.ex];const n=phaseSets(it.sets,ph);const secs=[30,40,50][level()-1]+(ph.k==='spinta'?10:0);
   for(let k=1;k<=n;k++){steps.push({type:'rest',secs:k===1?10:it.rest,ex});steps.push({type:'work',ex,secs,label:ex.n+' · serie '+k+'/'+n,phase:'main'})}return}
  sl=MASS.find(x=>x.id===it.slot);if(it.orSlot&&sl&&(sl.req||[]).some(r=>!eq.includes(r)))sl=MASS.find(x=>x.id===it.orSlot);
  if(it.ex){const e=EXM[it.ex];if(e.req.every(r=>eq.includes(r))){ex=e;fixed=true}}
  else if(sl){const r=slotEx(sl,eq);if(r){ex=r.ex;lvl=r.lvl;nl=sl.lad.length}}
  if(!ex&&it.alt){const e=EXM[it.alt];if(e.req.every(r=>eq.includes(r))){ex=e;fixed=true}}
  if(!ex)return;
  const n=phaseSets(it.sets,ph);const kg=(!fixed&&sl&&sl.load)?(S.mass.kg[sl.id]!=null?S.mass.kg[sl.id]:(ex.bag==='hand'?3:0)):0;
  const ll=lastLog(sl?sl.id:'x',ex.id);
  for(let k=1;k<=n;k++){steps.push({type:'rest',secs:k===1?10:it.rest,ex,kg});steps.push({type:'set',ex,slot:sl?sl.id:'x-'+ex.id,sn:sl?sl.n:ex.n,setNo:k,sets:n,kg,lvl,nl,fixed,range:it.range,prog:!fixed&&(ph.k==='costr'||ph.k==='spinta'),last:ll&&ll.reps[k-1]!=null?ll.reps[k-1]:null,secs:45,phase:'main'})}
 });
 [L==='C'?'flessinpiedi':'flessori','polpacci'].map(i=>EXM[i]).filter(e=>e.req.every(r=>eq.includes(r))).forEach((e,i)=>{steps.push({type:'switch',ex:e,secs:5});steps.push({type:'work',ex:e,secs:50,label:'Defaticamento · '+(i+1)+'/2',phase:'cool'})});
 return steps;
}
function sessDone(mon){const o={};S.wk.filter(w=>monday(w.date)===mon&&/^sess[ABC]$/.test(w.focus)&&!w.partial).forEach(w=>{o[w.date]=w.focus.slice(4)});return o}
function planWeek(mon){
 const days=[...Array(7)].map((_,i)=>addD(mon,i)),t=today();const dd=sessDone(mon);const doneSet=new Set(Object.values(dd));
 const free=days.filter(d=>d>=t&&!isCalcio(d)&&!dd[d]);const rem=['A','B','C'].filter(x=>!doneSet.has(x));
 let best=null,bs=-1e9;
 const k=Math.min(rem.length,free.length);
 const combos=(arr,n,st=0,cur=[],out=[])=>{if(cur.length===n){out.push(cur.slice());return out}for(let i=st;i<arr.length;i++){cur.push(arr[i]);combos(arr,n,i+1,cur,out);cur.pop()}return out};
 const perms=a=>a.length<=1?[a]:a.flatMap((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).map(p=>[x,...p]));
 const sessList=rem.slice(0,Math.max(k,0));
 for(const dset of combos(free,k)){for(const pr of perms(rem.length>k?rem:sessList)){const ass=pr.slice(0,k);let sc=0;
   ass.forEach((x,i)=>{const d=dset[i];const nx=isCalcio(addD(d,1)),pv=isCalcio(addD(d,-1));
    if(x==='A'){if(nx)sc-=3;if(pv)sc-=3;if(isCalcio(addD(d,2)))sc-=0.3}
    if(x==='C'&&nx)sc+=2;if((x==='B'||x==='C')&&pv)sc+=0.5;sc-=0.15*days.indexOf(d)});
   for(let i=1;i<k;i++)if(diffD(dset[i-1],dset[i])===1)sc-=2;
   for(let i=1;i<k;i++)if(ass[i-1]<ass[i])sc+=0.5;
   if(sc>bs){bs=sc;best={dset,ass}}}}
 const res={};
 days.forEach(d=>{
  if(dd[d]){res[d]={focus:'sess'+dd[d],why:'Fatto',done:true};return}
  if(isCalcio(d)){res[d]={focus:'pre',why:'Oggi giochi: solo attivazione prima del calcio',calcio:true};return}
  const i=best?best.dset.indexOf(d):-1;
  if(i>=0){const x=best.ass[i];res[d]={focus:'sess'+x,why:isCalcio(addD(d,1))?'Domani calcio: sessione senza gambe pesanti':'Programma della settimana'};return}
  if(isCalcio(addD(d,-1)))res[d]={focus:'mobilita',why:'Ieri calcio: recupero e mobilità'};
  else res[d]={focus:'mobilita',why:d<t?'Riposo':'Riposo attivo: mobilità leggera',rest:true};
 });
 return res;
}

 const same=keep&&i===PL.i;PL.i=i;const s=PL.steps[i];if(!same){PL.rem=s.secs;PL.count=0;PL.edited=false;PL.said={}}PL.lastBeep=-1;PL.halfDone=false;PL.last=performance.now();

 if(useCam){pf.innerHTML='';pf.appendChild(CAM.makeBox());CAM.video.play().catch(()=>{});CAM.setEx(e,ev=>{if(ev.rep){PL.count=ev.rep;updCount();coachRep(ev.rep,s)}});PL.fig={paused:true,svg:document.createElementNS('http://www.w3.org/2000/svg','svg'),opts:{}}}
 else{if(CAM.box&&CAM.box.isConnected)CAM.box.remove();
 PL.fig=mountFig(pf,e,{line:true,bag:(s.kg||(PL.steps[i+1]||{}).kg)?(e.bag||'back'):null});}PL.fig.paused=PL.paused||!isW;PL.figEl=0;

 cue.textContent=isW?e.cueA:(e.steps[0]||'');
 const tip=isW?`<div class="ok" style="margin:0 0 4px">${I('check')}<span>${esc(e.ok[0])}</span></div><div class="err" style="margin:0">${I('x')}<span>${esc(e.err[0])}</span></div>`:`<div class="mu" style="text-align:center">${esc(s.reps?s.reps+' ripetizioni'+(e.side?' per lato':''):Math.round((PL.steps[i+1]||s).secs/(e.side?2:1))+' secondi'+(e.side?' per lato':''))}</div>`;

 if(isSet){const def=s.last!=null?s.last:10;

function renderTime(){const s=PL.steps[PL.i];if(s.type==='set'){PL.el.querySelector('#ptime').textContent=PL.count||'0';return}PL.el.querySelector('#ptime').textContent=mmss(PL.rem);
 if(s.type==='work'&&s.reps){const el=s.secs-PL.rem;const per=s.ex.side?s.secs/2:s.secs;const r=Math.min(s.reps,Math.floor((el%per)/s.ex.tempo)+1);PL.el.querySelector('#preps').textContent='Ripetizione '+r+' di '+s.reps+(s.ex.side?(el<per?' · lato 1':' · lato 2'):'')}

function tickPlayer(){
 if(!PL)return;const now=performance.now();const dt=(now-PL.last)/1000;PL.last=now;if(PL.paused)return;
 const s=PL.steps[PL.i];if(s.type==='set'){PL.worked+=dt;return}PL.rem-=dt;if(s.type==='work')PL.worked+=dt;
 const whole=Math.ceil(PL.rem);
 if(whole<=3&&whole>=1&&whole!==PL.lastBeep){PL.lastBeep=whole;beep(880,0.1);vib(60);if(s.type==='work'&&!s.reps)COACH.say(['','Uno','Due','Tre'][whole])}
 if(s.type==='work'&&s.secs>=25&&!PL.said.half&&PL.rem<=s.secs/2&&!s.ex.side){PL.said.half=1;COACH.say('Metà! '+COACH.hype())}
 if(s.type==='work'&&s.secs>=25&&!PL.said.ten&&PL.rem<=10&&PL.rem>9){PL.said.ten=1;COACH.say('Ultimi dieci secondi, dai!')}
 if(s.type==='rest'&&s.secs>=20&&!PL.said.ten&&PL.rem<=10&&PL.rem>9){PL.said.ten=1;COACH.say('Dieci secondi. Preparati.')}
 if(s.type==='work'&&s.reps){const el2=s.secs-PL.rem;const per=s.ex.side?s.secs/2:s.secs;const r=Math.min(s.reps,Math.floor((el2%per)/s.ex.tempo)+1);if(r>1&&r!==PL.said.rep){PL.said.rep=r;coachRep(r-1,s)}}
 if(s.type==='work'&&s.ex.side&&!PL.halfDone&&PL.rem<=s.secs/2){PL.halfDone=true;beep(990,0.2);vib([150,80,150]);toast('Cambia lato!');COACH.say('Cambia lato!',true)}
 if(PL.rem<=0){goStep(PL.i+1);return}
 if(s.type==='work'&&PL.fig){const el=s.secs-PL.rem;const per=s.ex.side?s.secs/2:s.secs;PL.fig.t0=now-(el%per)*1000}
 renderTime();
}

function lineChart(pts,unit){
 if(pts.length<2)return `<div class="empty">${pts.length?'Serve almeno un altro valore per vedere la linea.':'Ancora nessun dato.'}</div>`;
 const W=300,H=140,pl=34,pr=10,pt=12,pb=22;const ys=pts.map(p=>p.v);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1}const padv=(mx-mn)*0.15;mn-=padv;mx+=padv;
 const x=i=>pl+(W-pl-pr)*i/(pts.length-1),y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
 const grid=[mn,(mn+mx)/2,mx].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#3A2860"/><text x="${pl-4}" y="${y(v)+4}" fill="#8A7AAA" font-size="10" text-anchor="end">${Math.round(v*10)/10}</text>`).join('');
 const path=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
 const lab=[0,pts.length-1].map(i=>`<text x="${x(i)}" y="${H-6}" fill="#8A7AAA" font-size="10" text-anchor="${i?'end':'start'}">${fmt(pts[i].d)}</text>`).join('');
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">${grid}<path d="${path}" fill="none" stroke="#FDB927" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="#FDB927"/>`).join('')}${lab}</svg>`;
}
function vProg(m){
 const opts=[...MEAS.map(([k,n,u])=>[k,n,u]),['push','Piegamenti','rip.'],['squat','Squat 60″','rip.'],['plank','Plank','sec']];
 const cur=opts.find(o=>o[0]===PROGM)||opts[0];
 const src=['push','squat','plank'].includes(cur[0])?S.tests:S.meas;
 const pts=src.filter(x=>x[cur[0]]!=null&&x[cur[0]]!=='').map(x=>({d:x.date,v:+x[cur[0]]})).sort((a,b)=>a.d.localeCompare(b.d));
 const delta=pts.length>1?Math.round((pts[pts.length-1].v-pts[0].v)*10)/10:null;
 const tot=S.wk.length,mins=S.wk.reduce((a,w)=>a+(w.min||0),0);const rec=Math.max(0,...S.tests.map(t=>t.push||0)),pk=Math.max(0,...S.tests.map(t=>t.plank||0));
 const weeks=[...Array(8)].map((_,i)=>{const mon=addD(monday(today()),-7*(7-i));return{mon,n:S.wk.filter(w=>monday(w.date)===mon).length,c:S.calLog.filter(c=>monday(c.date)===mon).length}});
 const mxw=Math.max(3,...weeks.map(w=>w.n+w.c));
 m.innerHTML=`<h1>Progressi</h1>
 <div class="chips" style="flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-bottom:10px">${opts.map(o=>`<button class="chip ${o[0]===cur[0]?'on':''}" data-pm="${o[0]}" style="flex:none">${o[1]}</button>`).join('')}</div>
 <div class="card">${lineChart(pts,cur[2])}${delta!=null?`<div class="small" style="color:${(cur[0]==='vita'||cur[0]==='fianchi'||cur[0]==='peso')?(delta<=0?'var(--ok)':'var(--gold2)'):(delta>=0?'var(--ok)':'var(--gold2)')}">${delta>0?'+':''}${delta} ${cur[2]} dalla prima misura</div>`:''}</div>
 <div class="grid2"><div class="stat"><span class="small mu">Record piegamenti</span><b>${rec}</b></div><div class="stat"><span class="small mu">Plank migliore</span><b>${mmss(pk)}</b></div><div class="stat"><span class="small mu">Allenamenti</span><b style="color:#fff">${tot}</b></div><div class="stat"><span class="small mu">Minuti totali</span><b style="color:#fff">${mins}</b></div></div>
 <h2>Programma 8 settimane</h2><div class="card"><div style="display:flex;gap:3px">${[1,2,3,4,5,6,7,8].map(w=>`<div style="flex:1;height:10px;border-radius:5px;background:${phaseOf(w).c};opacity:${w===progWeek()?1:0.35};${w===progWeek()?'outline:2px solid #fff':''}"></div>`).join('')}</div><div class="small" style="margin-top:8px"><b style="color:${phaseOf().c}">Settimana ${progWeek()} · ${phaseOf().n}</b> <span class="mu">${phaseOf().d}</span></div></div>
 <h2>Muscoli della settimana</h2><div class="card"><div class="small mu" style="margin-bottom:8px">Serie di Massa e tono · obiettivo 10-20 per muscolo</div>${muscleBars(weekSets())}</div>
 <h2>Livelli Massa e tono</h2><div class="card">${MASS.map(sl=>{const lv=Math.min(slotLvl(sl),sl.lad.length-1);const kg=S.mass.kg[sl.id]||0;return `<div class="mrow small"><span>${esc(sl.n)}</span><span>${esc(EXM[sl.lad[lv]].n)} <span class="dim">${lv+1}/${sl.lad.length}${kg?' · '+String(kg).replace('.',',')+' kg':''}</span></span></div>`}).join('')}</div>
 <h2>Ultime 8 settimane</h2><div class="card"><svg viewBox="0 0 300 110" style="width:100%">${weeks.map((w,i)=>{const x=10+i*36,h1=w.n/mxw*80,h2=w.c/mxw*80;return `<rect x="${x}" y="${90-h1}" width="14" height="${h1}" rx="3" fill="#FDB927"/><rect x="${x+16}" y="${90-h2}" width="10" height="${h2}" rx="3" fill="#B9A8D6"/><text x="${x+13}" y="104" fill="#8A7AAA" font-size="9" text-anchor="middle">${fmt(w.mon).split(' ')[0]}</text>`}).join('')}</svg>
 <div class="legend"><span><i style="background:#FDB927"></i>Allenamenti</span><span><i style="background:#B9A8D6"></i>Calcio</span></div></div>
 <div class="row between"><h2>Test di livello</h2><button class="chip on" id="rt">${I('refresh')} Rifai</button></div>
 ${S.tests.length?S.tests.slice().reverse().map(t=>`<div class="card small" style="padding:10px 12px"><b>${fmt(t.date)}</b> · ${['','Principiante','Intermedio','Avanzato'][t.level]} <div class="mu">Piegamenti ${t.push} · Squat ${t.squat} · Plank ${t.plank}″ · Mobilità ${t.mob}</div></div>`).join(''):'<div class="empty">Nessun test salvato.</div>'}
 <h2>Medaglie · ${Object.keys(S.medals).length}/${MEDALS.length}</h2>
 ${MEDALS.map(([id,n,d])=>`<div class="medal ${S.medals[id]?'got':''}"><div class="md">${I('medal')}</div><div><b>${esc(n)}</b><div class="small mu">${esc(d)}${S.medals[id]?' · '+fmt(S.medals[id]):''}</div></div></div>`).join('')}`;
 m.querySelectorAll('[data-pm]').forEach(b=>b.onclick=()=>{PROGM=b.dataset.pm;render()});
 $('#rt').onclick=()=>testView($('#main'),false);
}

/* ---------- CORPO ---------- */
function fmtN(v){return String(Math.round(v*10)/10).replace('.',',')}
function vBody(m){
 const ms=S.meas.slice().sort((a,b)=>a.date.localeCompare(b.date));
 const lastOf=k=>{for(let i=ms.length-1;i>=0;i--)if(ms[i][k]!=null&&ms[i][k]!=='')return{v:+ms[i][k],i};return null};
 const prevOf=(k,i)=>{for(let j=i-1;j>=0;j--)if(ms[j][k]!=null&&ms[j][k]!=='')return +ms[j][k];return null};
 const lastDate=ms.length?ms[ms.length-1].date:null;const daysSince=lastDate?diffD(lastDate,today()):null;
 const card=([k,n,u])=>{const L=lastOf(k);let v='<span class="dim">—</span>',dl='';if(L){v=fmtN(L.v)+' <span style="font-size:14px;font-weight:500">'+u+'</span>';const p=prevOf(k,L.i);if(p!=null){const x=Math.round((L.v-p)*10)/10;if(x)dl=`<span class="dl" style="color:${x<0?'var(--ok)':'var(--gold)'}">${x>0?'+':''}${fmtN(x)} dall'ultima</span>`}}
  return `<button class="mcard" data-hint="${k}"><span class="small mu">${n}</span><b>${v}</b>${dl||'<span class="dl dim">&nbsp;</span>'}</button>`};
 m.innerHTML=`<div class="row between"><h1 style="margin:0">Il mio corpo</h1><button class="chip on" id="addm">${I('plus')} Misura</button></div>
 <div class="small dim" style="margin:4px 0 12px">${lastDate?'Ultima misura: '+fmt(lastDate)+(daysSince>=14?' · è ora di misurarti di nuovo':''):'Misurati ogni 2 settimane, alla stessa ora e nelle stesse condizioni'}</div>
 <div class="card row" style="gap:14px;align-items:center"><div style="width:78px;flex:none">${BODYSVG}</div><div id="mhint" class="small mu" style="line-height:1.45">Tocca una misura qui sotto: ti mostro dove mettere il metro.</div></div>
 <div class="grid2">${MEAS.map(card).join('')}</div>
 <div class="row between"><h2>Foto progresso</h2><label class="chip on" style="margin:0;color:#2A1A47">${I('cam')} Aggiungi<input type="file" accept="image/*" id="ph" style="display:none"></label></div>
 <div class="small dim" style="margin-bottom:8px">Le foto restano solo su questo telefono. Scatta sempre fronte e lato, con la stessa luce.</div>
 <div id="phs" class="photos"></div>
 <h2>Storico misure</h2>${ms.length?ms.slice().reverse().map(x=>`<div class="card" style="padding:10px 12px"><div class="row between"><b>${fmt(x.date)}</b><button class="chip" data-delm="${x.id}" style="padding:5px 8px" aria-label="Elimina">${I('trash')}</button></div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${MEAS.filter(([k])=>x[k]!=null&&x[k]!=='').map(([k,n,u])=>`<span class="tag" style="font-size:12px;padding:4px 8px">${n} <b style="color:var(--tx)">${fmtN(+x[k])}</b> ${u}</span>`).join('')}</div></div>`).join(''):'<div class="empty">Nessuna misura ancora. Tocca "Misura" per iniziare.</div>'}`;
 $('#addm').onclick=measForm;
 m.querySelectorAll('[data-hint]').forEach(b=>b.onclick=()=>{const x=MEAS.find(q=>q[0]===b.dataset.hint);hlMeas(x[0]);m.querySelectorAll('.mcard').forEach(c=>c.classList.toggle('sel',c===b));$('#mhint').innerHTML=`<b style="color:var(--gold)">${x[1]}</b><br>${esc(x[3])}`});
 m.querySelectorAll('[data-delm]').forEach(b=>b.onclick=()=>confirmBox('Eliminare questa misurazione?','Elimina',()=>{S.meas=S.meas.filter(q=>q.id!==b.dataset.delm);save();render()}));
 $('#ph').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;const data=await shrink(f);if(!data){toast('Non riesco a leggere questa foto');return}
  sheet(`<h2 style="margin-top:0">Che foto è?</h2><img src="${data}" style="width:100%;border-radius:12px;max-height:40vh;object-fit:contain"><div class="seg" style="margin-top:10px"><button data-v="Fronte" class="on">Fronte</button><button data-v="Lato">Lato</button><button data-v="Dietro">Dietro</button></div><div style="height:12px"></div><button class="btn" id="phs2">Salva foto</button>`,(el,close)=>{let v='Fronte';el.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{v=b.dataset.v;el.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on',x===b))});
   el.querySelector('#phs2').onclick=async()=>{const ok=await IDB.put({id:uid(),date:today(),view:v,data});close();toast(ok?'Foto salvata':'Non posso salvare foto in questo browser');loadPhotos()}})};
 loadPhotos();
}
const BODYSVG=`<svg viewBox="0 0 110 200" id="bsvg"><ellipse cx="55" cy="18" rx="11" ry="13" fill="#ECE4F7"/><rect x="49" y="29" width="12" height="9" fill="#ECE4F7"/><path d="M30 40 Q55 34 80 40 L76 92 Q55 98 34 92 Z" fill="#ECE4F7"/><path d="M30 41 Q20 44 18 60 L14 100 L21 101 L27 64 Z" fill="#D9CCEF"/><path d="M80 41 Q90 44 92 60 L96 100 L89 101 L83 64 Z" fill="#D9CCEF"/><path d="M34 92 Q55 99 76 92 L74 112 L57 114 L53 114 L36 112 Z" fill="#C9B8E6"/><path d="M36 110 L53 113 L50 155 L48 190 L39 190 L38 155 Z" fill="#ECE4F7"/><path d="M74 110 L57 113 L60 155 L62 190 L71 190 L72 155 Z" fill="#ECE4F7"/>
<g stroke="#FDB927" stroke-width="3" id="mlines" opacity="1"><line data-k="collo" x1="47" y1="33" x2="63" y2="33"/><line data-k="spalle" x1="24" y1="43" x2="86" y2="43"/><line data-k="petto" x1="28" y1="54" x2="82" y2="54"/><line data-k="braccio" x1="14" y1="58" x2="29" y2="58"/><line data-k="avambraccio" x1="14" y1="82" x2="23" y2="82"/><line data-k="vita" x1="33" y1="82" x2="77" y2="82"/><line data-k="fianchi" x1="34" y1="104" x2="76" y2="104"/><line data-k="coscia" x1="37" y1="128" x2="53" y2="128"/><line data-k="polpaccio" x1="38" y1="166" x2="50" y2="166"/></g></svg>`;
function hlMeas(k){document.querySelectorAll('#mlines line').forEach(l=>{l.style.display=l.dataset.k===k?'':'none'})}
async function loadPhotos(){const el=$('#phs');if(!el)return;const all=(await IDB.all()).sort((a,b)=>b.date.localeCompare(a.date));if(!$('#phs'))return;
 el.innerHTML=all.length?all.map(p=>`<button data-p="${p.id}" style="border:0;padding:0;background:none;color:var(--tx);text-align:left"><img src="${p.data}" alt="Foto ${esc(p.view)}"><div class="small dim">${fmt(p.date)} · ${esc(p.view)}</div></button>`).join(''):'<div class="empty" style="grid-column:1/-1">Nessuna foto.</div>';
 el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=all.find(x=>x.id===b.dataset.p);sheet(`<img src="${p.data}" style="width:100%;border-radius:12px"><div class="row between" style="margin-top:10px"><span class="mu">${fmt(p.date)} · ${esc(p.view)}</span><button class="chip" id="pdel">${I('trash')} Elimina</button></div>`,(s,close)=>{s.querySelector('#pdel').onclick=async()=>{await IDB.del(p.id);close();loadPhotos()}})})}
function shrink(file){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,900/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);try{r(c.toDataURL('image/jpeg',0.75))}catch(e){r(null)}};img.onerror=()=>r(null);img.src=fr.result};fr.onerror=()=>r(null);fr.readAsDataURL(file)})}
function measForm(){
 const last=S.meas.slice().sort((a,b)=>a.date.localeCompare(b.date)).pop()||{};
 sheet(`<h2 style="margin-top:0">Nuova misura</h2><label>Data</label><input type="date" id="md" value="${today()}">
 <div>${MEAS.map(([k,n,u,h])=>`<div style="margin-top:12px"><div class="row" style="gap:10px"><label style="margin:0;flex:1;font-size:15px;color:var(--tx)">${n} <span class="dim">(${u})</span></label><input type="number" inputmode="decimal" step="0.1" id="m_${k}" style="width:110px;text-align:center" placeholder="${last[k]!=null?String(last[k]).replace('.',','):''}"></div><div class="hint">${esc(h)}</div></div>`).join('')}</div>
 <p class="small dim">Compila solo quello che vuoi: puoi lasciare vuote le altre.</p><button class="btn" id="msave">Salva misure</button>`,(el,close)=>{
  el.querySelector('#msave').onclick=()=>{const o={id:uid(),date:el.querySelector('#md').value||today()};let any=false;MEAS.forEach(([k])=>{const v=el.querySelector('#m_'+k).value.replace(',','.');if(v!==''&&!isNaN(+v)){o[k]=+v;any=true}});if(!any){toast('Inserisci almeno una misura');return}
   S.meas.push(o);save();const nm=checkMedals();close();render();toast(nm.length?'Nuova medaglia: '+nm.join(', '):'Misure salvate')}});
}

/* ---------- IMPOSTAZIONI ---------- */
function importSheet(){sheet(`<h2 style="margin-top:0">Importa backup</h2><p class="small mu">Nell'altra versione dell'app: Impostazioni → Copia backup. Poi incolla qui.</p><textarea id="bt" rows="6" placeholder="Incolla qui il testo del backup"></textarea><div style="height:10px"></div><button class="btn" id="bgo">Importa</button>`,(e2,c2)=>{e2.querySelector('#bgo').onclick=()=>{try{const o=JSON.parse(e2.querySelector('#bt').value);if(!o||!o.name)throw 0;S={...DEF(),...o};migrateLocs();save();c2();render();toast('Backup importato')}catch(x){toast('Testo del backup non valido')}}})}
function settings(){
 sheet(`<h2 style="margin-top:0">Impostazioni</h2>
 <label>Nome</label><input id="sn" value="${esc(S.name)}">
 <label>Livello</label><div class="seg" id="slv">${['Principiante','Intermedio','Avanzato'].map((n,i)=>`<button data-l="${i+1}" class="${S.level===i+1?'on':''}">${n}</button>`).join('')}</div>
 <label>Luoghi e attrezzi</label><button class="btn sec" id="sloc">${I('pin')} I tuoi luoghi (${S.locs.length})</button>
 <label>Avvisi del timer</label><div class="chips"><button class="chip ${S.set.sound?'on':''}" id="ss">Beep</button><button class="chip ${S.set.vib?'on':''}" id="sv">Vibrazione</button><button class="chip ${S.set.voice!==false?'on':''}" id="svo">Voce del coach</button></div>
 <div class="hint">La vibrazione funziona su Android; su iPhone il browser non la permette, resta il beep.</div>
 <label>Programma</label><div class="small mu">Settimana ${progWeek()} di 8 · ${phaseOf().n} (dal ${fmt(S.start)})</div><button class="btn ghost" id="srest" style="margin-top:6px">Ricomincia il programma dalla settimana 1</button>
 <label>Salvataggio</label><div class="small mu">${syncState==='cloud'?'Sul telefono e nel tuo spazio privato dell\'account Claude: ritrovi i dati anche su un altro dispositivo.':'Solo su questo telefono.'} Le foto restano solo sul telefono.</div>
 <div class="grid2" style="margin-top:8px"><button class="btn sec" id="bcopy">${I('copy')} Copia backup</button><button class="btn sec" id="bimp">Importa backup</button></div>
 <div style="height:14px"></div><button class="btn" id="ssave">Salva</button>
 <button class="btn danger" id="sreset" style="margin-top:20px">Cancella tutti i dati</button>`,(el,close)=>{
  let lv=S.level;el.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lv=+b.dataset.l;el.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('on',x===b))});
  el.querySelector('#ss').onclick=e=>{S.set.sound=!S.set.sound;e.currentTarget.classList.toggle('on',S.set.sound);if(S.set.sound)beep()};
  el.querySelector('#sloc').onclick=()=>{close();placesSheet()};
  el.querySelector('#sv').onclick=e=>{S.set.vib=!S.set.vib;e.currentTarget.classList.toggle('on',S.set.vib);vib(100)};
  el.querySelector('#svo').onclick=e=>{S.set.voice=S.set.voice===false;e.currentTarget.classList.toggle('on',S.set.voice!==false);if(S.set.voice!==false)COACH.say('Ciao! Sono il tuo coach. Spingiamo!',true)};
  el.querySelector('#srest').onclick=()=>{S.start=today();save();toast('Programma ripartito dalla settimana 1')};
  el.querySelector('#bcopy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S));toast('Backup copiato: incollalo in una nota per conservarlo')}catch(e){toast('Copia non riuscita su questo browser')}};
  el.querySelector('#bimp').onclick=()=>{close();importSheet()};
  el.querySelector('#ssave').onclick=()=>{const n=el.querySelector('#sn').value.trim();if(n)S.name=n;S.level=lv;save();close();render();toast('Impostazioni salvate')};
  el.querySelector('#sreset').onclick=()=>{close();confirmBox('Cancellare tutti i dati? Non si può annullare.','Cancella tutto',()=>{S=DEF();save();render()})};
 });
}

render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
</html>
