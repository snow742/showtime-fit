<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Showtime Fit</title>
<meta name="theme-color" content="#140B24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Showtime Fit">
<link rel="apple-touch-icon" href="icon180.png">
<link rel="icon" type="image/png" href="icon192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#140B24;--card:#22143B;--card2:#2E1C4F;--pur:#552583;--pur2:#7B4BB7;--gold:#FDB927;--gold2:#F3CF73;--tx:#F3EEFB;--mu:#B4A6CF;--dim:#8A7AAA;--ok:#97C459;--bad:#F09595;--line:#3A2860;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Barlow,system-ui,sans-serif;font-size:15px;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{overflow:hidden;position:fixed;inset:0}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(14px + var(--st)) 16px 24px;overscroll-behavior:contain}
.tabs{display:flex;justify-content:space-around;background:#1B0F2E;border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sb))}
.tabs button{flex:1;background:none;border:0;color:var(--dim);font:500 11px Barlow,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--gold)}
h1{font:700 30px/1.05 'Barlow Condensed',sans-serif;margin:2px 0 12px;letter-spacing:.3px}
h2{font:700 21px 'Barlow Condensed',sans-serif;margin:20px 0 10px;letter-spacing:.3px}
h3{font:600 17px Barlow,sans-serif;margin:0 0 4px}
.mu{color:var(--mu)}.dim{color:var(--dim)}.small{font-size:13px}.gold{color:var(--gold)}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{background:var(--pur);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card2);color:var(--mu);border:0;border-radius:20px;padding:8px 13px;font:500 14px Barlow,sans-serif;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--gold);color:#2A1A47}
.chip.wh.on{background:#fff;color:var(--pur)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px;font:700 18px 'Barlow Condensed',sans-serif;letter-spacing:.5px;background:var(--gold);color:#2A1A47}
.btn.sec{background:var(--card2);color:var(--tx);font:600 16px Barlow,sans-serif}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--tx);font:600 15px Barlow,sans-serif}
.btn.danger{background:#5A1A2A;color:#FFD6D6;font:600 15px Barlow,sans-serif}
.btn svg{width:20px;height:20px}
.ic{width:20px;height:20px;flex:none}
.tile{background:var(--card);border-radius:14px;padding:12px;border:0;color:var(--tx);text-align:left;font:inherit}
.tile .ic{color:var(--gold)}
.stat{background:var(--card);border-radius:12px;padding:12px}
.stat b{display:block;font:700 26px 'Barlow Condensed',sans-serif;color:var(--gold)}
input,select,textarea{font:500 16px Barlow,sans-serif;background:#1B0F2E;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--pur2);border-color:transparent}
label{font-size:13px;color:var(--mu);display:block;margin:10px 0 4px}
.fig{display:block;width:100%;height:auto}
.figbox{background:var(--card2);border-radius:14px;overflow:hidden}
.ok{background:#1D3410;color:#CFE8A9;border-radius:10px;padding:8px 10px;margin:6px 0;display:flex;gap:8px;font-size:14px}
.err{background:#3A1020;color:#F7C1C1;border-radius:10px;padding:8px 10px;margin:6px 0;display:flex;gap:8px;font-size:14px}
.ok svg,.err svg{width:18px;height:18px;flex:none;margin-top:1px}
.list-ex{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:8px;margin-bottom:8px;border:0;color:var(--tx);width:100%;text-align:left;font:inherit}
.list-ex .th{width:92px;flex:none;background:var(--card2);border-radius:10px}
.tag{font-size:11px;background:var(--card2);color:var(--mu);border-radius:8px;padding:2px 7px;display:inline-block;margin:2px 4px 0 0}
.tag.g{background:#4A3A12;color:var(--gold2)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,4,20,.72);z-index:70;display:flex;align-items:flex-end;animation:fade .15s}
.sheet{background:#1B0F2E;border-radius:22px 22px 0 0;width:100%;max-height:92%;overflow-y:auto;padding:18px 16px calc(20px + var(--sb));animation:up .2s ease-out;overscroll-behavior:contain}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.5}}@keyframes fade{from{opacity:0}}
.player{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:calc(10px + var(--st)) 16px calc(14px + var(--sb))}
.pbar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.timer{font:700 64px/1 'Barlow Condensed',sans-serif;text-align:center;color:#fff;font-variant-numeric:tabular-nums}
.ctrl{display:flex;gap:10px;justify-content:center;align-items:center}
.ctrl button{background:var(--card2);border:0;color:#fff;border-radius:50%;width:56px;height:56px;display:flex;align-items:center;justify-content:center}
.ctrl button.big{width:72px;height:72px;background:var(--gold);color:#2A1A47}
.ctrl svg{width:26px;height:26px}
.cue{background:var(--pur);border-radius:12px;padding:10px 12px;text-align:center;font-weight:500;min-height:44px}
.dayrow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.dayrow.today{outline:2px solid var(--gold)}
.dname{width:44px;text-align:center}.dname b{display:block;font:700 20px 'Barlow Condensed',sans-serif}
.ball{width:42px;height:42px;border-radius:50%;border:0;background:var(--card2);color:var(--dim);display:flex;align-items:center;justify-content:center;flex:none}
.ball.on{background:#fff;color:var(--pur)}
.medal{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px}
.medal .md{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card2);color:var(--dim);flex:none}
.medal.got .md{background:var(--gold);color:#2A1A47}
.medal:not(.got){opacity:.6}
.toast{position:fixed;left:16px;right:16px;bottom:calc(90px + var(--sb));background:var(--gold);color:#2A1A47;border-radius:14px;padding:12px 14px;font-weight:600;z-index:80;animation:up .2s}
.num{display:flex;align-items:center;gap:8px}.num button{width:44px;height:44px;border-radius:12px;border:0;background:var(--card2);color:#fff;font:700 22px Barlow,sans-serif;flex:none}.num input{text-align:center;font-weight:600;font-size:20px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border:0}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block}
.logo{display:flex;align-items:center;gap:12px}.logo svg{width:52px;height:52px;border-radius:12px}
.hint{font-size:12px;color:var(--dim);margin-top:4px}
.empty{color:var(--dim);text-align:center;padding:16px 8px;font-size:14px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px}.seg button{flex:1;border:0;background:none;color:var(--mu);padding:9px 4px;border-radius:9px;font:600 14px Barlow,sans-serif}.seg button.on{background:var(--gold);color:#2A1A47}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu);margin:8px 2px}.legend i{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:5px;vertical-align:-1px}
</style>
</head>

function beep(f=880,d=0.12,v=0.25){if(!S.set.sound||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);const t=AC.currentTime;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.start(t);o.stop(t+d+0.02)}catch(e){}}
function vib(p){if(!S.set.vib)return;try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* ---------- logica: livello, programma, piano ---------- */
const level=()=>S.level||1;
function progWeek(){const w=Math.floor(Math.max(0,diffD(S.start,today()))/7);return (w%6)+1}
const PF=[1,1.08,1.16,1.24,1.32,0.85];
function isCalcio(d){const w=S.calW[monday(d)]||[];return w.includes(dIdx(d))||S.calLog.some(c=>c.date===d)}
function planFor(d){
 if(isCalcio(d))return{focus:'pre',why:'Oggi giochi: fai solo l\'attivazione prima del calcio'};
 if(isCalcio(addD(d,1)))return{focus:'massa',why:'Domani calcio: massa solo parte alta'};
 if(isCalcio(addD(d,-1)))return{focus:'mobilita',why:'Ieri calcio: recupero e mobilità'};
 const mon=monday(d);let k=0;for(let i=0;i<dIdx(d);i++){const x=addD(mon,i);if(!isCalcio(x)&&!isCalcio(addD(x,1))&&!isCalcio(addD(x,-1)))k++}
 const wn=Math.floor(diffD('2024-01-01',mon)/7);if(k%2===0)return{focus:'massa',why:'Giorno libero: si costruisce muscolo'};return{focus:ROT[(Math.floor(k/2)+wn)%ROT.length],why:'Giorno libero: condizione per il calcio'};
}
function okEx(e,eq){return e.req.every(r=>eq.includes(r))&&level()>=e.lv[0]&&level()<=e.lv[1]}
function workAmt(e){const pf=PF[progWeek()-1];const b=e.base[level()-1];const v=Math.max(e.mode==='reps'?2:15,Math.round(b*pf/(e.mode==='time'?5:1))*(e.mode==='time'?5:1));return v}
function workSecs(e){const a=workAmt(e);return (e.mode==='reps'?Math.round(a*e.tempo):a)*(e.side?2:1)}
function buildWorkout(focus,D,loc){
 if(focus==='massa')return buildMass(D,loc);
 const eq=LOCS[loc].eq,r=seeded(today()+focus+loc+D);
 const F=FOCUS[focus];const steps=[];
 const nW={10:3,20:4,30:5,45:6}[D]||4,nC={10:2,20:3,30:3,45:4}[D]||3;
 let warm=WARM.map(i=>EXM[i]).filter(e=>okEx(e,eq)).slice(0,nW);
 let cool=COOL.map(i=>EXM[i]).filter(e=>okEx(e,eq));
 if(cool.some(e=>e.id==='flessori'))cool=cool.filter(e=>e.id!=='flessinpiedi');cool=cool.slice(0,nC);
 const push=(e,secs,label,phase,reps)=>steps.push({type:'work',ex:e,secs,label,phase,reps});
 const sw=e=>steps.push({type:'switch',ex:e,secs:6});
 if(F.fixed){const list=F.fixed.map(i=>EXM[i]).filter(e=>okEx(e,eq)||e.req.every(r=>eq.includes(r)));const per=Math.max(30,Math.round((D*60)/list.length)-6);list.forEach((e,i)=>{sw(e);push(e,e.side?per:per,'Attivazione · '+(i+1)+'/'+list.length,'warm')});return steps}
 const wS=e=>e.side?50:35,cS=e=>e.side?50:35;
 warm.forEach((e,i)=>{sw(e);push(e,wS(e),'Riscaldamento · '+(i+1)+'/'+warm.length,'warm')});
 let pool=F.pool.map(i=>EXM[i]).filter(e=>okEx(e,eq));
 if(!pool.length)pool=FOCUS.calcio.pool.map(i=>EXM[i]).filter(e=>okEx(e,eq));
 pool=shuffle(pool,r);
 const E=Math.min(pool.length,{10:3,20:4,30:5,45:6}[D]||4);const main=pool.slice(0,E);
 const used=warm.reduce((a,e)=>a+wS(e)+6,0)+cool.reduce((a,e)=>a+cS(e)+6,0);
 const M=D*60-used;const rest=F.mob?8:[35,30,25][level()-1];
 const round=main.reduce((a,e)=>a+(F.mob?40*(e.side?2:1):workSecs(e))+rest,0)+(F.mob?0:30);
 const rounds=clamp(Math.round(M/round),1,5);
 for(let g=1;g<=rounds;g++){main.forEach((e,i)=>{
   const secs=F.mob?40*(e.side?2:1):workSecs(e);
   steps.push({type:'rest',secs:(g===1&&i===0)?8:rest,ex:e});
   push(e,secs,(F.mob?'Mobilità':'Circuito')+' · giro '+g+'/'+rounds,'main',(!F.mob&&e.mode==='reps')?workAmt(e):0)});
   if(g<rounds&&!F.mob)steps.push({type:'rest',secs:30,ex:main[0],round:true})}
 cool.forEach((e,i)=>{sw(e);push(e,cS(e),'Defaticamento · '+(i+1)+'/'+cool.length,'cool')});
 return steps;
}
function buildPausa(){const st=[];PAUSA.forEach((id,i)=>{const e=EXM[id];st.push({type:'switch',ex:e,secs:5});st.push({type:'work',ex:e,secs:e.side?50:35,label:'Pausa autista · '+(i+1)+'/'+PAUSA.length,phase:'warm'})});return st}
function buildSingle(e){const st=[];for(let s=1;s<=3;s++){st.push({type:'rest',secs:s===1?8:[35,30,25][level()-1],ex:e});st.push({type:'work',ex:e,secs:workSecs(e),label:'Serie '+s+'/3',phase:'main',reps:e.mode==='reps'?workAmt(e):0})}return st}
function estMin(steps){return Math.round(steps.reduce((a,s)=>a+s.secs,0)/60)}

const MASS=[
 {id:'petto',n:'Spinta petto',mus:'petto',lad:['pushknee','pushup','pushfeet','pushdiamond','pusharcher']},
 {id:'trazioni',n:'Trazioni',mus:'schiena',req:['sbarra'],lad:['pullneg','pullup'],load:true},
 {id:'rematore',n:'Rematore zaino',mus:'schiena',req:['zaino'],lad:['rowzaino'],load:true},
 {id:'remelast',n:'Rematore elastico',mus:'schiena',req:['elastico'],lad:['rowband']},
 {id:'spalle',n:'Spalle',mus:'spalle',req:['zaino'],lad:['pressz'],load:true},
 {id:'bicipiti',n:'Bicipiti',mus:'braccia',req:['zaino'],lad:['curl'],load:true},
 {id:'tricipiti',n:'Tricipiti',mus:'braccia',req:['sedia'],lad:['dip']},
 {id:'squat',n:'Squat',mus:'gambe',lad:['squat','squatpausa','bulgaro','pistol'],load:true,legs:true},
 {id:'posteriori',n:'Glutei e femorali',mus:'gambe',lad:['ponte','ponteuna','nordic'],legs:true},
 {id:'addome',n:'Addome',mus:'addome',lad:['deadbug','crunchinv']},
 {id:'polpacci',n:'Polpacci',mus:'gambe',lad:['calf'],load:true,legs:true}
];
const MUSG=[['petto','Petto'],['schiena','Schiena'],['spalle','Spalle'],['braccia','Braccia'],['gambe','Gambe'],['addome','Addome']];
const MREST=75,MRANGE=[8,15];
function weekSets(mon=monday(today())){const o=Object.fromEntries(MUSG.map(m=>[m[0],0]));S.mass.log.filter(l=>monday(l.date)===mon).forEach(l=>{const sl=MASS.find(x=>x.id===l.slot);if(sl)o[sl.mus]+=l.reps.length});return o}
function slotLvl(sl){if(S.mass.lv[sl.id]!=null)return S.mass.lv[sl.id];if(sl.id==='petto')return [0,1,2][level()-1];if(sl.id==='squat')return level()===3?1:0;if(sl.id==='trazioni')return level()===3?1:0;return 0}
function slotEx(sl,eq){if((sl.req||[]).some(r=>!eq.includes(r)))return null;const lv=Math.min(slotLvl(sl),sl.lad.length-1);for(let i=lv;i>=0;i--){const e=EXM[sl.lad[i]];if(e.req.every(r=>eq.includes(r)))return{ex:e,lvl:i}}return null}
function lastLog(slot,exid){for(let i=S.mass.log.length-1;i>=0;i--){const l=S.mass.log[i];if(l.slot===slot&&l.ex===exid)return l}return null}
function lastSlotDate(slot){for(let i=S.mass.log.length-1;i>=0;i--)if(S.mass.log[i].slot===slot)return S.mass.log[i].date;return ''}
function noLegsToday(){return isCalcio(today())||isCalcio(addD(today(),1))}
function pickSlots(D,loc){
 const eq=LOCS[loc].eq,n={10:2,20:3,30:4,45:5}[D]||3,noLegs=noLegsToday();
 const ws=weekSets();const cand=MASS.filter(sl=>!(noLegs&&sl.legs)).map(sl=>({sl,...(slotEx(sl,eq)||{})})).filter(c=>c.ex);
 const out=[],per={};
 while(out.length<n){
  const left=cand.filter(c=>!out.includes(c)&&(per[c.sl.mus]||0)<2&&!(c.sl.id==='remelast'&&out.some(o=>o.sl.id==='rematore'))&&!(c.sl.id==='rematore'&&out.some(o=>o.sl.id==='remelast'))&&!(c.sl.id==='polpacci'&&out.length<n-1));
  if(!left.length)break;
  left.sort((a,b)=>(ws[a.sl.mus]+(per[a.sl.mus]||0)*3)-(ws[b.sl.mus]+(per[b.sl.mus]||0)*3)||lastSlotDate(a.sl.id).localeCompare(lastSlotDate(b.sl.id))||MASS.indexOf(a.sl)-MASS.indexOf(b.sl));
  const c=left[0];out.push(c);per[c.sl.mus]=(per[c.sl.mus]||0)+1;
 }
 return out;
}
function buildMass(D,loc){
 const eq=LOCS[loc].eq,steps=[];const sets=D>=45?4:D<=10?2:3;
 const warm=['skip','circ','rematore'].map(i=>EXM[i]);warm.forEach((e,i)=>{steps.push({type:'switch',ex:e,secs:5});steps.push({type:'work',ex:e,secs:30,label:'Riscaldamento · '+(i+1)+'/3',phase:'warm'})});
 pickSlots(D,loc).forEach(({sl,ex,lvl})=>{const kg=sl.load?(S.mass.kg[sl.id]!=null?S.mass.kg[sl.id]:(ex.bag==='hand'?3:0)):0;const ll=lastLog(sl.id,ex.id);
  for(let k=1;k<=sets;k++){steps.push({type:'rest',secs:k===1?10:MREST,ex,kg});steps.push({type:'set',ex,slot:sl.id,sn:sl.n,setNo:k,sets,kg,lvl,nl:sl.lad.length,last:ll&&ll.reps[k-1]!=null?ll.reps[k-1]:null,secs:45,phase:'main'})}});
 return steps;
}
function applyMass(res){const ups=[];
 Object.entries(res).forEach(([slot,r])=>{if(!r.reps.length)return;S.mass.log.push({date:today(),slot,ex:r.ex,kg:r.kg,reps:r.reps});
  const sl=MASS.find(x=>x.id===slot);const lv=r.lvl;
  if(r.reps.length>=r.sets&&r.reps.every(x=>x>=MRANGE[1])){
   if(lv<sl.lad.length-1){S.mass.lv[slot]=lv+1;S.mass.kg[slot]=EXM[sl.lad[lv+1]].bag==='hand'?3:0;ups.push(sl.n+': passi a '+EXM[sl.lad[lv+1]].n)}
   else if(sl.load){S.mass.kg[slot]=Math.round(((r.kg||0)+1.5)*10)/10;ups.push(EXM[r.ex].n+': zaino +1,5 kg (ora '+String(S.mass.kg[slot]).replace('.',',')+' kg)')}
   else ups.push(EXM[r.ex].n+': massimo raggiunto, rallenta la discesa');
  }else if(r.reps.length>=r.sets&&r.reps.every(x=>x<5)){
   if(sl.load&&(r.kg||0)>0){S.mass.kg[slot]=Math.max(0,(r.kg||0)-1.5);ups.push(EXM[r.ex].n+': zaino più leggero (-1,5 kg)')}
   else if(lv>0){S.mass.lv[slot]=lv-1;ups.push(sl.n+': torni a '+EXM[sl.lad[lv-1]].n+' per fare più ripetizioni')}
  }});
 return ups}
function bott(kg){const n=Math.round(kg/1.5*10)/10;return (Number.isInteger(n)?n:String(n).replace('.',','))+(n===1?' bottiglia':' bottiglie')+' da 1,5 L'}
function muscleBars(ws){return MUSG.map(([k,n])=>{const v=ws[k]||0;const ok=v>=10;return `<div style="margin-bottom:9px"><div class="row between small"><span>${n}</span><span style="color:${ok?'var(--ok)':'var(--gold2)'}">${v}${ok?' ✓':' · ne mancano '+(10-v)}</span></div><div style="height:8px;background:var(--card2);border-radius:4px;position:relative"><div style="width:${Math.min(100,v/20*100)}%;height:100%;background:${ok?'var(--gold)':'var(--gold2)'};border-radius:4px"></div><div style="position:absolute;left:50%;top:-2px;width:2px;height:12px;background:#fff"></div></div></div>`}).join('')}

const FOODS=[['Uova ×2',12],['Petto di pollo 150 g',35],['Tacchino 150 g',33],['Tonno in scatola 80 g',20],['Salmone 150 g',30],['Merluzzo 150 g',27],['Carne magra 150 g',32],['Bresaola 80 g',26],['Prosciutto crudo 80 g',21],['Yogurt greco 170 g',17],['Latte 250 ml',8],['Ricotta 100 g',11],['Mozzarella 125 g',23],['Parmigiano 30 g',10],['Legumi cotti 150 g',12],['Pasta 100 g (cruda)',12],['Pane 100 g',9],['Proteine in polvere 30 g',22],['Frutta secca 30 g',6],['Albume 100 g',11]];
const PASTI=['Colazione','Pranzo','Spuntino','Cena'];
function bodyW(){const m=S.meas.filter(x=>x.peso).sort((a,b)=>a.date.localeCompare(b.date)).pop();return m?m.peso:null}
function protTarget(){const w=bodyW();return w?Math.round(w*S.prot.f):null}

function autoPasto(){const h=new Date().getHours();return h<11?'Colazione':h<15?'Pranzo':h<19?'Spuntino':'Cena'}
function ring(v,t,sz=96){const p=t?Math.min(1,v/t):0;const c=2*Math.PI*40;return `<svg width="${sz}" height="${sz}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="#2E1C4F" stroke-width="12"/><circle cx="50" cy="50" r="40" fill="none" stroke="${p>=1?'#97C459':'#FDB927'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p)).toFixed(1)}" transform="rotate(-90 50 50)"/><text x="50" y="52" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" font-family="Barlow,sans-serif">${Math.round(v)}</text><text x="50" y="68" text-anchor="middle" font-size="11" fill="#B4A6CF" font-family="Barlow,sans-serif">${t?'di '+t+' g':'g'}</text></svg>`}

   const ks=Object.keys(S.prot.days).sort();if(ks.length>60){ks.slice(0,ks.length-60).forEach(k=>delete S.prot.days[k])}
  };draw();
 });

/* streak e medaglie */
function activeDays(){const s=new Set();S.wk.forEach(w=>s.add(w.date));S.pauses.forEach(p=>s.add(p));S.calLog.forEach(c=>s.add(c.date));return s}
function streak(){const a=activeDays();let d=today();if(!a.has(d))d=addD(d,-1);let n=0;while(a.has(d)){n++;d=addD(d,-1)}return n}
function bestStreak(){const a=[...activeDays()].sort();let best=0,cur=0,prev=null;for(const d of a){cur=(prev&&diffD(prev,d)===1)?cur+1:1;best=Math.max(best,cur);prev=d}return best}
function monthSolid(){const a=activeDays();let runs=0;let mon=monday(today());for(let i=0;i<60;i++){let c=0;for(let j=0;j<7;j++)if(a.has(addD(mon,j)))c++;if(c>=2){runs++;if(runs>=4)return true}else if(i>0)runs=0;mon=addD(mon,-7)}return false}

 ['s3','3 giorni di fila','Streak accesa',()=>bestStreak()>=3],['s7','7 giorni di fila','Settimana perfetta',()=>bestStreak()>=7],['s14','14 giorni di fila','Inarrestabile',()=>bestStreak()>=14],

/* ---------- UI generale ---------- */
let TAB='home',LIBCAT='tutti',PROGM='peso',WEEKOFF=0;
const TABS=[['home','Home','home'],['week','Settimana','cal'],['lib','Esercizi','list'],['prog','Progressi','chart'],['body','Corpo','ruler']];
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function sheet(html,onMount){const bg=document.createElement('div');bg.className='sheet-bg';bg.innerHTML=`<div class="sheet"><div class="grab"></div>${html}</div>`;bg.addEventListener('click',e=>{if(e.target===bg)bg.remove()});document.body.appendChild(bg);const close=()=>bg.remove();onMount&&onMount(bg.firstChild,close);return close}
function confirmBox(msg,yes,cb){sheet(`<h2 style="margin-top:0">${esc(msg)}</h2><div class="grid2"><button class="btn sec" data-n>Annulla</button><button class="btn danger" data-y>${esc(yes)}</button></div>`,(el,close)=>{el.querySelector('[data-n]').onclick=close;el.querySelector('[data-y]').onclick=()=>{close();cb()}})}
function render(){
 if(!S.name||!S.level){$('#tabs').style.display='none';return onboarding()}
 $('#tabs').style.display='';
 $('#tabs').innerHTML=TABS.map(([k,n,ic])=>`<button class="${TAB===k?'on':''}" data-tab="${k}">${I(ic)}${n}</button>`).join('');
 const m=$('#main');m.scrollTop=0;
 ({home:vHome,week:vWeek,lib:vLib,prog:vProg,body:vBody})[TAB](m);
}
document.addEventListener('click',e=>{unlockAudio();const t=e.target.closest('[data-tab]');if(t){TAB=t.dataset.tab;render()}},true);

/* ---------- onboarding e test ---------- */
function onboarding(){
 const m=$('#main');
 if(!S.name){m.innerHTML=`<div style="padding-top:30px"><div class="logo" style="justify-content:center;margin-bottom:18px"><span style="width:96px;height:96px;display:block;border-radius:22px;overflow:hidden">${LOGO}</span></div>
 <h1 style="text-align:center;font-size:40px">SHOWTIME <span class="gold">FIT</span></h1><p class="mu" style="text-align:center">Allenamenti a corpo libero pensati per chi guida tante ore e gioca a calcio.</p>
 <label>Come ti chiami?</label><input id="nm" autocomplete="given-name" placeholder="Il tuo nome"><div style="height:14px"></div><button class="btn" id="go">Iniziamo ${I('chev')}</button><button class="btn ghost" id="imp" style="margin-top:10px">Ho un backup da importare</button>
 <p class="dim small" style="margin-top:14px">I dati restano salvati sul tuo telefono. L'app funziona anche senza internet.</p></div>`;
 $('#imp').onclick=importSheet;
 $('#go').onclick=()=>{const v=$('#nm').value.trim();if(!v){$('#nm').focus();$('#nm').style.outline='2px solid #F09595';return}S.name=v;save();render()};return}
 testView(m,true);
}
function testView(m,first){
 const T={push:10,squat:30,plank:45,mob:'quasi'};
 const card=(id,ex,tit,desc,unit)=>`<div class="card"><div class="row" style="align-items:flex-start"><div style="width:96px;flex:none" class="figbox">${staticFig(EXM[ex],ex==='plank'?0:1)}</div><div><h3>${tit}</h3><div class="small mu">${desc}</div></div></div>
 <div class="num" style="margin-top:10px"><button data-dec="${id}">−</button><input type="number" inputmode="numeric" id="t_${id}" value="${T[id]}"><button data-inc="${id}">+</button><span class="mu small" style="width:60px">${unit}</span></div></div>`;
 m.innerHTML=`${first?'':`<button class="chip" id="bk">${I('back')} Indietro</button>`}<h1>Test di livello</h1><p class="mu">4 prove veloci per capire da dove partire. Riposa 1-2 minuti tra una prova e l'altra. Lo ripeterai ogni 4 settimane.</p>
 ${card('push','pushup','1 · Piegamenti massimi','Quanti piegamenti fai di fila con il corpo dritto? Se non ne fai, metti quanti sulle ginocchia diviso 2.','rip.')}
 ${card('squat','squat','2 · Squat in 60 secondi','Quanti squat completi in un minuto.','rip.')}
 ${card('plank','plank','3 · Plank','Quanti secondi resti in plank con il corpo dritto.','sec')}
 <div class="card"><div class="row" style="align-items:flex-start"><div style="width:96px;flex:none" class="figbox">${staticFig(EXM.stretchfem,1)}</div><div><h3>4 · Mobilità</h3><div class="small mu">Gambe tese, ti pieghi in avanti: tocchi i piedi con le dita?</div></div></div>
 <div class="seg" style="margin-top:10px" id="mob"><button data-m="si">Sì</button><button data-m="quasi" class="on">Quasi</button><button data-m="no">No</button></div></div>
 <button class="btn" id="calc">Calcola il mio livello</button><button class="btn ghost" id="manual" style="margin-top:10px">Scelgo io il livello</button>`;
 if(!first)$('#bk').onclick=render;
 let mob='quasi';
 m.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mob=b.dataset.m;m.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b))});
 m.querySelectorAll('[data-inc],[data-dec]').forEach(b=>b.onclick=()=>{const id=b.dataset.inc||b.dataset.dec;const i=$('#t_'+id);const st=id==='plank'?5:1;i.value=Math.max(0,(+i.value||0)+(b.dataset.inc?st:-st))});
 const finish=(lv,t)=>{S.level=lv;if(t)S.tests.push(t);if(first)S.start=today();save();const nm=checkMedals();
  m.innerHTML=`<div style="padding-top:40px;text-align:center"><div class="gold" style="font:700 22px 'Barlow Condensed',sans-serif">IL TUO LIVELLO</div><div style="font:700 64px 'Barlow Condensed',sans-serif">${['','PRINCIPIANTE','INTERMEDIO','AVANZATO'][lv]}</div>
  <p class="mu">Gli allenamenti si adattano a questo livello e crescono ogni settimana per 5 settimane, poi una settimana più leggera.</p>${nm.length?`<p class="gold">${I('medal')} Medaglia: ${esc(nm.join(', '))}</p>`:''}<button class="btn" id="ok">Vai alla home</button></div>`;
  $('#ok').onclick=()=>{TAB='home';render()}};
 $('#calc').onclick=()=>{const p=+$('#t_push').value||0,q=+$('#t_squat').value||0,k=+$('#t_plank').value||0;
  const sc=[p<10?1:p<25?2:3,q<30?1:q<45?2:3,k<45?1:k<90?2:3,mob==='si'?3:mob==='quasi'?2:1];
  const lv=clamp(Math.round(sc.reduce((a,b)=>a+b)/4),1,3);finish(lv,{date:today(),push:p,squat:q,plank:k,mob,level:lv})};
 $('#manual').onclick=()=>sheet(`<h2 style="margin-top:0">Scegli il livello</h2>${['Principiante','Intermedio','Avanzato'].map((n,i)=>`<button class="btn sec" style="margin-bottom:8px" data-l="${i+1}">${n}</button>`).join('')}`,(el,close)=>el.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{close();finish(+b.dataset.l,null)}));
}

/* ---------- HOME ---------- */
let homeDur=20,homeFocus=null;
function vHome(m){
 const d=today(),pl=planFor(d),fc=homeFocus||pl.focus,F=FOCUS[fc];
 const st=streak(),wkSet=!!S.calW[monday(d)];
 const steps=buildWorkout(fc,homeDur,S.loc);const nEx=new Set(steps.filter(s=>(s.type==='work'||s.type==='set')&&s.phase==='main').map(s=>s.ex.id)).size;
 const lastT=S.tests[S.tests.length-1];const retest=lastT&&diffD(lastT.date,d)>=28;
 const doneToday=S.wk.some(w=>w.date===d);
 m.innerHTML=`<div class="row between"><span class="mu">${GGL[dIdx(d)]} ${fmt(d)}</span><div class="row"><span class="gold row" style="gap:4px">${I('flame')} ${st} ${st===1?'giorno':'giorni'}</span><button class="chip" id="set" aria-label="Impostazioni" style="padding:7px">${I('set')}</button></div></div>
 <h1 style="margin-top:8px">Ciao ${esc(S.name)}, pronto a muoverti?</h1>
 <div class="chips" style="margin-bottom:12px">${Object.entries(LOCS).map(([k,l])=>`<button class="chip ${S.loc===k?'on':''}" data-loc="${k}">${I(l.ic)} ${l.n}</button>`).join('')}</div>
 ${!wkSet?`<button class="card row" id="setw" style="width:100%;border:0;color:var(--tx);text-align:left;border:1px dashed var(--gold)">${I('ball','ic gold')}<div style="flex:1"><b>Quando giochi questa settimana?</b><div class="small mu">Segna i giorni di calcio e il piano si sistema da solo</div></div>${I('chev')}</button>`:''}
 <div class="hero">
  <div class="small" style="color:var(--gold)">Settimana ${progWeek()} di 6${progWeek()===6?' · scarico':''} · ${esc(pl.why)}</div>
  <div style="font:700 26px 'Barlow Condensed',sans-serif;margin:4px 0">${esc(F.n)}</div>
  <div class="small" style="color:#D9CCEF">${F.mass?'Serie da 8-15 fino quasi al limite · recupero 75″'+(noLegsToday()?' · niente gambe (calcio vicino)':''):F.fixed?'Mobilità e attivazione per arrivare pronto alla partita':nEx+' esercizi · '+LOCS[S.loc].n+' ('+LOCS[S.loc].d+')'}${doneToday?' · fatto oggi '+'✓':''}</div>
  <div class="chips" style="margin:12px 0">${[10,20,30,45].map(x=>`<button class="chip wh ${homeDur===x?'on':''}" data-dur="${x}" style="background:${homeDur===x?'#fff':'transparent'};border:1px solid #8A6BBE;color:${homeDur===x?'var(--pur)':'#fff'}">${x}′</button>`).join('')}</div>
  <button class="btn" id="start">${I('play')} Inizia · ${estMin(steps)} min</button>
  <button class="chip" id="chg" style="margin-top:10px;background:transparent;color:#D9CCEF;padding:4px 0">${I('refresh')} Cambia tipo di allenamento</button>
 </div>
 <button class="card row" id="prot" style="width:100%;border:0;color:var(--tx);text-align:left">${ring(protDay(),protTarget(),58)}<div style="flex:1"><b>Proteine oggi</b><div class="small mu">${protTarget()?(protDay()>=protTarget()?'Obiettivo raggiunto':'Ne mancano '+(protTarget()-protDay())+' g'):'Inserisci il peso per l\'obiettivo'}</div></div>${I('plus','ic gold')}</button>
 <div class="grid2">
  <button class="tile" id="pausa">${I('wheel')}<div style="font-weight:600;margin-top:4px">Pausa autista</div><div class="small dim">4 min · collo, schiena, anche</div></button>
  <button class="tile" id="calcio">${I('ball')}<div style="font-weight:600;margin-top:4px">Registra calcio</div><div class="small dim">partita o allenamento</div></button>
 </div>
 ${retest?`<button class="card row" id="rt" style="width:100%;border:0;color:var(--tx);text-align:left;margin-top:12px">${I('target','ic gold')}<div style="flex:1"><b>È ora di rifare il test</b><div class="small mu">Sono passate 4 settimane: vediamo i progressi</div></div>${I('chev')}</button>`:''}
 <h2>Nel programma di oggi</h2>
 <div id="prev"></div>
 ${!S.dismissInstall?`<div class="card" style="margin-top:12px"><div class="row between"><b>${I('info','ic gold')} Mettila sul telefono</b><button class="chip" id="dism" style="padding:5px 9px">${I('x')}</button></div><div class="small mu" style="margin-top:6px">Funziona anche offline. <b>iPhone (Safari)</b>: tasto Condividi → "Aggiungi alla schermata Home". <b>Android (Chrome)</b>: menu ⋮ → "Aggiungi a schermata Home". Avrai l'icona Showtime Fit come un'app.</div></div>`:''}`;
 const main=steps.filter(s=>(s.type==='work'||s.type==='set')&&(s.phase==='main'||F.fixed));const seen=new Set();const uniq=main.filter(s=>!seen.has(s.ex.id)&&seen.add(s.ex.id));
 $('#prev').innerHTML=(F.mass?`<div class="card"><div class="small mu" style="margin-bottom:8px">Muscoli della settimana · serie fatte (obiettivo 10-20)</div>${muscleBars(weekSets())}</div>`:'')+uniq.map(s=>exRow(s.ex,s.type==='set'?s.sets+' serie × 8-15'+(s.ex.side?' per lato':'')+(s.kg?' · zaino '+String(s.kg).replace('.',',')+' kg':'')+' · livello '+(s.lvl+1)+'/'+s.nl:s.reps?s.reps+' rip.'+(s.ex.side?' per lato':''):Math.round(s.secs/(s.ex.side?2:1))+' sec'+(s.ex.side?' per lato':''),s.type==='set'&&s.kg?{bag:s.ex.bag||'back'}:{})).join('');
 bindExRows(m);
 m.querySelectorAll('[data-loc]').forEach(b=>b.onclick=()=>{S.loc=b.dataset.loc;save();render()});
 m.querySelectorAll('[data-dur]').forEach(b=>b.onclick=()=>{homeDur=+b.dataset.dur;render()});
 $('#start').onclick=()=>startPlayer(steps,{kind:F.mass?'massa':'workout',focus:fc,dur:homeDur});
 $('#prot').onclick=protSheet;
 $('#chg').onclick=()=>sheet(`<h2 style="margin-top:0">Che allenamento vuoi fare?</h2><p class="small mu">Consigliato oggi: ${esc(FOCUS[pl.focus].n)}</p>${Object.entries(FOCUS).map(([k,f])=>`<button class="btn ${k===fc?'':'sec'}" style="margin-bottom:8px" data-f="${k}">${esc(f.n)}${k===pl.focus?' · consigliato':''}</button>`).join('')}`,(el,close)=>el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{homeFocus=b.dataset.f===pl.focus?null:b.dataset.f;close();render()}));
 $('#pausa').onclick=()=>startPlayer(buildPausa(),{kind:'pausa'});
 $('#calcio').onclick=()=>calcioForm();
 $('#set').onclick=settings;
 if($('#setw'))$('#setw').onclick=()=>{TAB='week';WEEKOFF=0;render()};
 if($('#rt'))$('#rt').onclick=()=>testView($('#main'),false);
 if($('#dism'))$('#dism').onclick=()=>{S.dismissInstall=true;save();render()};
}
function exRow(e,sub,o={}){return `<button class="list-ex" data-ex="${e.id}"><div class="th">${staticFig(e,e.id==='plank'||e.id==='wallsit'?0:1,o)}</div><div style="flex:1;min-width:0"><div style="font-weight:600">${esc(e.n)}</div><div class="small mu">${esc(sub||'')}</div><div>${e.m.p.map(x=>`<span class="tag g">${MUSC[x]||x}</span>`).join('')}</div></div>${I('chev','ic dim')}</button>`}
function bindExRows(m){m.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>exDetail(EXM[b.dataset.ex]))}

/* ---------- dettaglio esercizio ---------- */
function exDetail(e){
 sheet(`<div class="row between"><div><h1 style="margin:0">${esc(e.n)}</h1><div class="small gold">${e.m.p.map(x=>MUSC[x]).join(' · ')}${e.m.s.length?' <span class="dim">+ '+e.m.s.map(x=>MUSC[x]).join(', ')+'</span>':''}</div></div></div>
 <div class="figbox" id="dfig" style="margin-top:12px"></div>
 <div class="legend"><span><i style="background:#FDB927"></i>Muscolo principale</span><span><i style="background:#F3CF73"></i>Aiuta / stabilizza</span></div>
 <div class="cue" id="dcue">${esc(e.cueA)}</div>
 <h2>Come si fa</h2>${e.steps.map((s,i)=>`<div class="row" style="align-items:flex-start;margin-bottom:8px"><b class="gold" style="font:700 20px 'Barlow Condensed',sans-serif;width:20px">${i+1}</b><div>${esc(s)}</div></div>`).join('')}
 <h2>Fallo così</h2>${e.ok.map(x=>`<div class="ok">${I('check')}<span>${esc(x)}</span></div>`).join('')}
 <h2>Errori da evitare</h2>${e.err.map(x=>`<div class="err">${I('x')}<span>${esc(x)}</span></div>`).join('')}
 <div class="grid2" style="margin-top:14px"><div class="card" style="margin:0"><div class="small dim">Più facile</div><div class="small">${esc(e.easy)}</div></div><div class="card" style="margin:0"><div class="small gold">Più difficile</div><div class="small">${esc(e.hard)}</div></div></div>
 <div class="small dim" style="margin:12px 0">Per te: ${e.mode==='reps'?workAmt(e)+' ripetizioni':workAmt(e)+' secondi'}${e.side?' per lato':''}${e.req.length?' · serve: '+e.req.join(', '):''}</div>
 <div class="small mu" style="margin-bottom:12px">Se senti dolore (non fatica), fermati e passa alla versione più facile.</div>
 <button class="btn" id="try">${I('play')} Prova 3 serie</button>`,(el,close)=>{
  const f=mountFig(el.querySelector('#dfig'),e,{line:true});const cue=el.querySelector('#dcue');let up=null;f.onPhase=ph=>{if(ph.up!==up){up=ph.up;cue.textContent=up?e.cueB:e.cueA}};
  el.querySelector('#try').onclick=()=>{close();startPlayer(buildSingle(e),{kind:'single',focus:e.cat,ex:e.id})}});
}

/* ---------- PLAYER ---------- */
let PL=null,wakeLock=null;
async function keepAwake(on){try{if(on&&navigator.wakeLock)wakeLock=await navigator.wakeLock.request('screen');else if(wakeLock){wakeLock.release();wakeLock=null}}catch(e){}}
function startPlayer(steps,meta){
 unlockAudio();keepAwake(true);
 const el=document.createElement('div');el.className='player';document.body.appendChild(el);
 PL={mass:{},steps,meta,i:0,rem:steps[0].secs,paused:false,last:performance.now(),el,start:Date.now(),lastBeep:-1,halfDone:false,worked:0};
 el.innerHTML=`<div class="row between"><button class="chip" id="px" aria-label="Chiudi">${I('x')}</button><span class="small mu" id="plab"></span><span class="small mu" id="pcount"></span></div>
 <div class="pbar" style="margin:10px 0"><i id="ppr"></i></div>
 <div id="ptitle" style="font:700 28px 'Barlow Condensed',sans-serif;text-align:center"></div>
 <div id="psub" class="small gold" style="text-align:center;min-height:18px"></div>
 <div class="figbox" id="pfig" style="margin:10px 0;flex:1;min-height:0;display:flex;align-items:center"></div>
 <div class="timer" id="ptime"></div><div id="preps" class="mu" style="text-align:center;min-height:20px;font-weight:600"></div>
 <div class="cue" id="pcue" style="margin:10px 0"></div>
 <div id="ptip" class="small" style="min-height:36px"></div>
 <div class="ctrl" style="margin-top:6px"><button id="pprev" aria-label="Indietro">${I('prev')}</button><button class="big" id="ppause" aria-label="Pausa">${I('pause')}</button><button id="pnext" aria-label="Avanti">${I('next')}</button></div>`;
 el.querySelector('#px').onclick=()=>confirmBox('Vuoi interrompere l\'allenamento?','Interrompi',()=>{if(PL.worked>120&&PL.meta.kind!=='single')finishPlayer(true);else closePlayer()});
 el.querySelector('#ppause').onclick=()=>{PL.paused=!PL.paused;el.querySelector('#ppause').innerHTML=I(PL.paused?'play':'pause');if(PL.fig)PL.fig.paused=PL.paused||PL.steps[PL.i].type!=='work';if(!PL.paused)PL.last=performance.now()};
 el.querySelector('#pnext').onclick=()=>goStep(PL.i+1);
 el.querySelector('#pprev').onclick=()=>goStep(Math.max(0,PL.i-(PL.steps[PL.i].type==='work'?2:1)));
 goStep(0);PL.timer=setInterval(tickPlayer,100);
}
function goStep(i){
 if(i>=PL.steps.length)return finishPlayer(false);
 PL.i=i;const s=PL.steps[i];PL.rem=s.secs;PL.lastBeep=-1;PL.halfDone=false;PL.last=performance.now();
 const el=PL.el,e=s.ex;
 const isWk=x=>x.type==='work'||x.type==='set';const works=PL.steps.filter(isWk);const wi=PL.steps.slice(0,i+1).filter(isWk).length;
 el.querySelector('#pcount').textContent=wi+'/'+works.length;
 el.querySelector('#ppr').style.width=(i/PL.steps.length*100)+'%';
 const isW=s.type==='work'||s.type==='set';const isSet=s.type==='set';
 el.querySelector('#plab').textContent=isW?s.label:(s.round?'Fine giro':s.type==='switch'?'Prossimo esercizio':'Recupero');
 el.querySelector('#ptime').style.fontSize=isSet?'44px':'';
 el.querySelector('#ptitle').textContent=isW?e.n:(s.round?'Recupero tra i giri':(s.type==='rest'?'Recupero':'Preparati'));
 el.querySelector('#psub').textContent=isSet?('Serie '+s.setNo+' di '+s.sets+' · livello '+(s.lvl+1)+'/'+s.nl+(s.kg?' · zaino '+String(s.kg).replace('.',',')+' kg ('+bott(s.kg)+')':'')+(e.side?' · per lato':'')):isW?(e.side?'Metà tempo per lato':''):'Prossimo: '+e.n+((PL.steps[i+1]||{}).type==='set'?' · serie '+PL.steps[i+1].setNo+'/'+PL.steps[i+1].sets:'');
 el.querySelector('#ptime').style.color=isW?'#fff':'var(--gold)';
 PL.fig=mountFig(el.querySelector('#pfig'),e,{line:true,bag:(s.kg||(PL.steps[i+1]||{}).kg)?(e.bag||'back'):null});PL.fig.paused=PL.paused||!isW;PL.figEl=0;
 if(!isW){PL.fig.svg.innerHTML=figSVG(e,0,PL.fig.opts)}
 const cue=el.querySelector('#pcue');let up=null;
 PL.fig.onPhase=ph=>{if(ph.up!==up){up=ph.up;cue.textContent=up?e.cueB:e.cueA}};
 cue.textContent=isW?e.cueA:(e.steps[0]||'');
 const tip=isW?`<div class="ok" style="margin:0 0 4px">${I('check')}<span>${esc(e.ok[0])}</span></div><div class="err" style="margin:0">${I('x')}<span>${esc(e.err[0])}</span></div>`:`<div class="mu" style="text-align:center">${esc(s.reps?s.reps+' ripetizioni'+(e.side?' per lato':''):Math.round((PL.steps[i+1]||s).secs/(e.side?2:1))+' secondi'+(e.side?' per lato':''))}</div>`;
 el.querySelector('#ptip').innerHTML=tip;
 el.querySelector('#preps').textContent='';
 const nx=PL.steps[i+1];
 if(!isW&&nx&&nx.type==='set')el.querySelector('#ptip').innerHTML=`<div class="mu" style="text-align:center">Obiettivo 8-15 ripetizioni${nx.last!=null?' · ultima volta '+nx.last:''}<br>fermati quando te ne restano 1-2</div>`;
 if(isSet){const def=s.last!=null?s.last:10;
  el.querySelector('#ptip').innerHTML=`<div class="num" style="justify-content:center"><button id="rm" aria-label="Meno">−</button><input type="number" inputmode="numeric" id="rv" value="${def}" style="width:90px;font-size:28px;color:var(--gold)"><button id="rp" aria-label="Più">+</button></div><button class="btn" id="sdone" style="margin-top:10px">${I('check')} Serie fatta</button>`;
  const rv=el.querySelector('#rv');el.querySelector('#rm').onclick=()=>rv.value=Math.max(0,(+rv.value||0)-1);el.querySelector('#rp').onclick=()=>rv.value=(+rv.value||0)+1;
  el.querySelector('#sdone').onclick=()=>{const r=PL.mass[s.slot]=PL.mass[s.slot]||{ex:e.id,kg:s.kg,lvl:s.lvl,sets:s.sets,reps:[]};r.reps.push(Math.max(0,Math.round(+rv.value||0)));goStep(PL.i+1)};
  el.querySelector('#preps').textContent='ripetizioni'+(s.last!=null?' · ultima volta '+s.last:'')+' · obiettivo 8-15';
 }

function hlMeas(k){document.querySelectorAll('#mlines line').forEach(l=>{const on=l.dataset.k===k;l.setAttribute('stroke',on?'#fff':'#FDB927');l.setAttribute('stroke-width',on?'3.5':'1.6');l.setAttribute('stroke-dasharray',on?'0':'3 2')})}
async function loadPhotos(){const el=$('#phs');if(!el)return;const all=(await IDB.all()).sort((a,b)=>b.date.localeCompare(a.date));if(!$('#phs'))return;
 el.innerHTML=all.length?all.map(p=>`<button data-p="${p.id}" style="border:0;padding:0;background:none;color:var(--tx);text-align:left"><img src="${p.data}" alt="Foto ${esc(p.view)}"><div class="small dim">${fmt(p.date)} · ${esc(p.view)}</div></button>`).join(''):'<div class="empty" style="grid-column:1/-1">Nessuna foto.</div>';
 el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=all.find(x=>x.id===b.dataset.p);sheet(`<img src="${p.data}" style="width:100%;border-radius:12px"><div class="row between" style="margin-top:10px"><span class="mu">${fmt(p.date)} · ${esc(p.view)}</span><button class="chip" id="pdel">${I('trash')} Elimina</button></div>`,(s,close)=>{s.querySelector('#pdel').onclick=async()=>{await IDB.del(p.id);close();loadPhotos()}})})}
function shrink(file){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,900/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);try{r(c.toDataURL('image/jpeg',0.75))}catch(e){r(null)}};img.onerror=()=>r(null);img.src=fr.result};fr.onerror=()=>r(null);fr.readAsDataURL(file)})}
function measForm(){
 const last=S.meas.slice().sort((a,b)=>a.date.localeCompare(b.date)).pop()||{};
 sheet(`<h2 style="margin-top:0">Nuova misura</h2><label>Data</label><input type="date" id="md" value="${today()}">
 <div class="grid2">${MEAS.map(([k,n,u,h])=>`<div><label>${n} (${u})</label><input type="number" inputmode="decimal" step="0.1" id="m_${k}" placeholder="${last[k]!=null?String(last[k]).replace('.',','):''}"><div class="hint">${esc(h)}</div></div>`).join('')}</div>
 <p class="small dim">Compila solo quello che vuoi: puoi lasciare vuote le altre.</p><button class="btn" id="msave">Salva misure</button>`,(el,close)=>{
  el.querySelector('#msave').onclick=()=>{const o={id:uid(),date:el.querySelector('#md').value||today()};let any=false;MEAS.forEach(([k])=>{const v=el.querySelector('#m_'+k).value.replace(',','.');if(v!==''&&!isNaN(+v)){o[k]=+v;any=true}});if(!any){toast('Inserisci almeno una misura');return}
   S.meas.push(o);save();const nm=checkMedals();close();render();toast(nm.length?'Nuova medaglia: '+nm.join(', '):'Misure salvate')}});
}

/* ---------- IMPOSTAZIONI ---------- */
function importSheet(){sheet(`<h2 style="margin-top:0">Importa backup</h2><p class="small mu">Nell'altra versione dell'app: Impostazioni → Copia backup. Poi incolla qui.</p><textarea id="bt" rows="6" placeholder="Incolla qui il testo del backup"></textarea><div style="height:10px"></div><button class="btn" id="bgo">Importa</button>`,(e2,c2)=>{e2.querySelector('#bgo').onclick=()=>{try{const o=JSON.parse(e2.querySelector('#bt').value);if(!o||!o.name)throw 0;S={...DEF(),...o};save();c2();render();toast('Backup importato')}catch(x){toast('Testo del backup non valido')}}})}
function settings(){
 sheet(`<h2 style="margin-top:0">Impostazioni</h2>
 <label>Nome</label><input id="sn" value="${esc(S.name)}">
 <label>Livello</label><div class="seg" id="slv">${['Principiante','Intermedio','Avanzato'].map((n,i)=>`<button data-l="${i+1}" class="${S.level===i+1?'on':''}">${n}</button>`).join('')}</div>
 <label>Avvisi del timer</label><div class="chips"><button class="chip ${S.set.sound?'on':''}" id="ss">Beep</button><button class="chip ${S.set.vib?'on':''}" id="sv">Vibrazione</button></div>
 <div class="hint">La vibrazione funziona su Android; su iPhone il browser non la permette, resta il beep.</div>
 <label>Programma</label><div class="small mu">Settimana ${progWeek()} di 6 (dal ${fmt(S.start)})</div><button class="btn ghost" id="srest" style="margin-top:6px">Ricomincia il programma dalla settimana 1</button>
 <label>Salvataggio</label><div class="small mu">${syncState==='cloud'?'Sul telefono e nel tuo spazio privato dell\'account Claude: ritrovi i dati anche su un altro dispositivo.':'Solo su questo telefono.'} Le foto restano solo sul telefono.</div>
 <div class="grid2" style="margin-top:8px"><button class="btn sec" id="bcopy">${I('copy')} Copia backup</button><button class="btn sec" id="bimp">Importa backup</button></div>
 <div style="height:14px"></div><button class="btn" id="ssave">Salva</button>
 <button class="btn danger" id="sreset" style="margin-top:20px">Cancella tutti i dati</button>`,(el,close)=>{
  let lv=S.level;el.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lv=+b.dataset.l;el.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('on',x===b))});
  el.querySelector('#ss').onclick=e=>{S.set.sound=!S.set.sound;e.currentTarget.classList.toggle('on',S.set.sound);if(S.set.sound)beep()};
  el.querySelector('#sv').onclick=e=>{S.set.vib=!S.set.vib;e.currentTarget.classList.toggle('on',S.set.vib);vib(100)};
  el.querySelector('#srest').onclick=()=>{S.start=today();save();toast('Programma ripartito dalla settimana 1')};
  el.querySelector('#bcopy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S));toast('Backup copiato: incollalo in una nota per conservarlo')}catch(e){toast('Copia non riuscita su questo browser')}};
  el.querySelector('#bimp').onclick=()=>{close();importSheet()};
  el.querySelector('#ssave').onclick=()=>{const n=el.querySelector('#sn').value.trim();if(n)S.name=n;S.level=lv;save();close();render();toast('Impostazioni salvate')};
  el.querySelector('#sreset').onclick=()=>{close();confirmBox('Cancellare tutti i dati? Non si può annullare.','Cancella tutto',()=>{S=DEF();save();render()})};
 });
}

render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
