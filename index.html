<!DOCTYPE html>
<html lang="it">

<style>
:root{--bg:#140B24;--card:#22143B;--card2:#2E1C4F;--pur:#552583;--pur2:#7B4BB7;--gold:#FDB927;--gold2:#F3CF73;--tx:#F3EEFB;--mu:#B4A6CF;--dim:#8A7AAA;--ok:#97C459;--bad:#F09595;--line:#3A2860;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Barlow,system-ui,sans-serif;font-size:15px;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{overflow:hidden;position:fixed;inset:0}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(14px + var(--st)) 16px 24px;overscroll-behavior:contain}
#main>*,.tabs,.player>*,.sheet>*{zoom:var(--fk,1)}
.tabs{display:flex;justify-content:space-around;background:#1B0F2E;border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sb))}
.tabs button{flex:1;background:none;border:0;color:var(--dim);font:500 11px Barlow,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--gold)}
h1{font:700 30px/1.05 'Barlow Condensed',sans-serif;margin:2px 0 12px;letter-spacing:.3px}
h2{font:700 21px 'Barlow Condensed',sans-serif;margin:20px 0 10px;letter-spacing:.3px}
h3{font:600 17px Barlow,sans-serif;margin:0 0 4px}
.mu{color:var(--mu)}.dim{color:var(--dim)}.small{font-size:13px}.gold{color:var(--gold)}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{background:var(--pur);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.grid2>*{min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card2);color:var(--mu);border:0;border-radius:20px;padding:8px 13px;font:500 14px Barlow,sans-serif;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--gold);color:#2A1A47}
.chip.wh.on{background:#fff;color:var(--pur)}
.btn{min-width:0;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px;font:700 18px 'Barlow Condensed',sans-serif;letter-spacing:.5px;background:var(--gold);color:#2A1A47}
.btn.sec{background:var(--card2);color:var(--tx);font:600 16px Barlow,sans-serif}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--tx);font:600 15px Barlow,sans-serif}
.btn.danger{background:#5A1A2A;color:#FFD6D6;font:600 15px Barlow,sans-serif}
.btn svg{width:20px;height:20px}
.ic{width:20px;height:20px;flex:none}
.tile{background:var(--card);border-radius:14px;padding:12px;border:0;color:var(--tx);text-align:left;font:inherit}
.tile .ic{color:var(--gold)}
.stat{background:var(--card);border-radius:12px;padding:12px}
.stat b{display:block;font:700 26px 'Barlow Condensed',sans-serif;color:var(--gold)}
input,select,textarea{font:500 16px Barlow,sans-serif;background:#1B0F2E;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--pur2);border-color:transparent}
label{font-size:13px;color:var(--mu);display:block;margin:10px 0 4px}
.fig{display:block;width:100%;height:auto}
.figbox{background:var(--card2);border-radius:14px;overflow:hidden}
.ok{background:#1D3410;color:#CFE8A9;border-radius:10px;padding:8px 10px;margin:6px 0;display:flex;gap:8px;font-size:14px}
.err{background:#3A1020;color:#F7C1C1;border-radius:10px;padding:8px 10px;margin:6px 0;display:flex;gap:8px;font-size:14px}
.ok svg,.err svg{width:18px;height:18px;flex:none;margin-top:1px}
.star{background:none;border:0;color:var(--dim);padding:8px;flex:none}.star.on{color:var(--gold)}.star svg{width:22px;height:22px}
.list-ex{cursor:pointer;display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:8px;margin-bottom:8px;border:0;color:var(--tx);width:100%;text-align:left;font:inherit}
.list-ex .th{width:92px;flex:none;background:var(--card2);border-radius:10px}
.tag{font-size:11px;background:var(--card2);color:var(--mu);border-radius:8px;padding:2px 7px;display:inline-block;margin:2px 4px 0 0}
.tag.g{background:#4A3A12;color:var(--gold2)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,4,20,.72);z-index:70;display:flex;align-items:flex-end;animation:fade .15s}
.sheet{position:relative;background:#1B0F2E;border-radius:22px 22px 0 0;width:100%;max-height:92%;overflow-y:auto;padding:18px 16px calc(20px + var(--sb));animation:up .2s ease-out;overscroll-behavior:contain}
.sx{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:var(--card2);color:var(--tx);display:flex;align-items:center;justify-content:center;z-index:2}.sx svg{width:20px;height:20px}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.5}}@keyframes fade{from{opacity:0}}
.player{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:calc(10px + var(--st)) 16px calc(14px + var(--sb))}
.pbar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.timer{font:700 64px/1 'Barlow Condensed',sans-serif;text-align:center;color:#fff;font-variant-numeric:tabular-nums}
.ctrl{display:flex;gap:10px;justify-content:center;align-items:center}
.ctrl button{background:var(--card2);border:0;color:#fff;border-radius:50%;width:56px;height:56px;display:flex;align-items:center;justify-content:center}
.ctrl button.big{width:72px;height:72px;background:var(--gold);color:#2A1A47}
.ctrl svg{width:26px;height:26px}
.cue{background:var(--pur);border-radius:12px;padding:10px 12px;text-align:center;font-weight:500;min-height:44px}
.dayrow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.dayrow.today{outline:2px solid var(--gold)}
.dname{width:44px;text-align:center}.dname b{display:block;font:700 20px 'Barlow Condensed',sans-serif}
.ball{width:42px;height:42px;border-radius:50%;border:0;background:var(--card2);color:var(--dim);display:flex;align-items:center;justify-content:center;flex:none}
.ball.on{background:#fff;color:var(--pur)}
.medal{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px}
.medal .md{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card2);color:var(--dim);flex:none}
.medal.got .md{background:var(--gold);color:#2A1A47}
.medal:not(.got){opacity:.6}
.toast{position:fixed;left:16px;right:16px;bottom:calc(90px + var(--sb));background:var(--gold);color:#2A1A47;border-radius:14px;padding:12px 14px;font-weight:600;z-index:80;animation:up .2s}
.num{display:flex;align-items:center;gap:8px}.num button{width:44px;height:44px;border-radius:12px;border:0;background:var(--card2);color:#fff;font:700 22px Barlow,sans-serif;flex:none}.num input{text-align:center;font-weight:600;font-size:20px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border:0}
#mlines line{display:none}
.qrow{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 2px;scrollbar-width:none}.qrow::-webkit-scrollbar{display:none}
.qcard{flex:0 0 132px;background:var(--card);border:0;border-radius:14px;padding:10px;color:var(--tx);text-align:left;display:flex;flex-direction:column;gap:3px;font:inherit}.qcard b{font-weight:600;font-size:14px}.qcard span{font-size:12px;color:var(--dim);line-height:1.3}
.todo{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--tx);padding:11px 0;text-align:left;font:inherit;font-size:14px}.todo:last-child{border:0}
.sect{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;color:var(--tx);font:700 19px 'Barlow Condensed',sans-serif;padding:8px 0;margin-top:4px;text-align:left}
.note{border-radius:12px;padding:9px 12px;margin-bottom:10px;font-size:13px;display:flex;gap:8px;align-items:center}.note.bad{background:#3A1020;color:#F7C1C1}.note.okk{background:#1D3410;color:#CFE8A9}
.mcard{background:var(--card);border:0;border-radius:12px;padding:10px 12px;text-align:left;color:var(--tx);display:flex;flex-direction:column;gap:2px;min-width:0;font:inherit}.mcard b{font:700 22px/1.1 'Barlow Condensed',sans-serif;white-space:nowrap}.mcard.sel{outline:2px solid var(--gold)}.mcard .dl{font-size:12px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block}
.logo{display:flex;align-items:center;gap:12px}.logo svg{width:52px;height:52px;border-radius:12px}
.hint{font-size:12px;color:var(--dim);margin-top:4px}
.empty{color:var(--dim);text-align:center;padding:16px 8px;font-size:14px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px}.seg button{flex:1;border:0;background:none;color:var(--mu);padding:9px 4px;border-radius:9px;font:600 14px Barlow,sans-serif}.seg button.on{background:var(--gold);color:#2A1A47}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu);margin:8px 2px}.legend i{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:5px;vertical-align:-1px}

/* ===== NEON ===== */
:root{--bg:#0B0614;--card:#140B24;--card2:#1F1238;--line:#33205F;--neo:#8A3FFC;--neo2:#B57BFF}
html,body{background:#0B0614}
main{background:radial-gradient(130% 55% at 50% -8%,rgba(138,63,252,.22),transparent 62%)}
.card,.stat,.mcard,.qcard,.list-ex,.dayrow,.medal{border:1px solid var(--line);box-shadow:0 0 14px rgba(138,63,252,.10)}
.hero{background:linear-gradient(160deg,#21103F 0%,#150B28 70%);border:1.5px solid var(--neo);box-shadow:0 0 22px rgba(138,63,252,.45),inset 0 0 20px rgba(138,63,252,.18)}
h1{text-shadow:0 0 18px rgba(181,123,255,.35)}
h2::before{content:'';display:inline-block;width:4px;height:17px;border-radius:2px;background:var(--neo2);box-shadow:0 0 8px var(--neo2);margin-right:9px;vertical-align:-2px}
.btn{box-shadow:0 0 16px color-mix(in srgb,var(--gold) 50%,transparent)}
.btn.sec,.btn.ghost,.btn.danger{box-shadow:none}
.btn.sec{background:#1D1135;border:1px solid var(--line)}
.chip{background:#1A0F2E;border:1px solid #2E1B55}
.chip.on{border-color:transparent;box-shadow:0 0 12px color-mix(in srgb,var(--gold) 45%,transparent)}
.btn,.chip,.qcard,.tile,.list-ex,.ctrl button,.ball,.tabs button,.card.row,.mrow[data-hx],.mrow[data-rd]{transition:transform .12s ease,box-shadow .2s ease,background .2s ease}
.btn:active,.chip:active,.qcard:active,.tile:active,.list-ex:active,.ctrl button:active,.ball:active,button.card:active{transform:scale(.96)}
.tabs{background:rgba(11,6,20,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabs button.on{color:var(--gold)}
.tabs button.on svg{filter:drop-shadow(0 0 6px var(--gold))}
.tabs button{position:relative}
.tabs button.on::after{content:'';position:absolute;top:-7px;left:30%;right:30%;height:3px;border-radius:2px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.sheet{background:#110920;border-top:1.5px solid var(--neo);box-shadow:0 -12px 40px rgba(138,63,252,.35)}
.sheet-bg{background:rgba(5,2,12,.75);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.figbox{background:radial-gradient(70% 55% at 50% 92%,rgba(138,63,252,.45),transparent 70%),radial-gradient(60% 60% at 50% 30%,rgba(181,123,255,.10),transparent 70%),linear-gradient(180deg,#1B0F31,#110920);border:1px solid var(--line)}
.figbox .fig{filter:drop-shadow(0 0 5px rgba(181,123,255,.35))}
.player{background:radial-gradient(120% 45% at 50% 0%,rgba(138,63,252,.25),transparent 60%),#0B0614}
.timer{text-shadow:0 0 22px color-mix(in srgb,var(--gold) 45%,transparent)}
.cue{background:#1B1033;border:1px solid var(--neo);box-shadow:0 0 12px rgba(138,63,252,.35)}
.pbar i{box-shadow:0 0 10px var(--gold)}
.ctrl button{background:#1D1135;border:1px solid var(--line)}
.ctrl button.big{border:0;box-shadow:0 0 22px color-mix(in srgb,var(--gold) 60%,transparent)}
.stat b,.mcard b{text-shadow:0 0 12px color-mix(in srgb,var(--gold) 35%,transparent)}
.medal.got .md{box-shadow:0 0 14px var(--gold)}
.dayrow.today{outline:1.5px solid var(--gold);box-shadow:0 0 16px rgba(253,185,39,.25)}
.qcard .ic{width:34px;height:34px;padding:7px;border-radius:11px;background:rgba(138,63,252,.18);box-shadow:inset 0 0 0 1px rgba(181,123,255,.25)}
.toast{box-shadow:0 0 24px color-mix(in srgb,var(--gold) 55%,transparent)}
input,select,textarea{background:#140B24;border-color:var(--line)}
.todo-card{padding:4px 12px}
.todo-card>button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--tx);padding:11px 0;text-align:left;font:inherit}
.todo-card>button:last-child{border-bottom:0}
.todo-card>button .ic{width:30px;height:30px;padding:6px;border-radius:10px;background:rgba(138,63,252,.18)}
#main.enter>*{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
#main.enter>*:nth-child(2){animation-delay:.03s}#main.enter>*:nth-child(3){animation-delay:.06s}#main.enter>*:nth-child(4){animation-delay:.09s}#main.enter>*:nth-child(5){animation-delay:.12s}#main.enter>*:nth-child(6){animation-delay:.15s}#main.enter>*:nth-child(7){animation-delay:.18s}#main.enter>*:nth-child(n+8){animation-delay:.21s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
#main.enter .ring-arc{animation:ring .9s .15s cubic-bezier(.2,.8,.2,1) both}
@keyframes ring{from{stroke-dasharray:0 999}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.pop{animation:pop .35s ease}
.sheet{animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(60px);opacity:.3}}
@media (prefers-reduced-motion:reduce){#main.enter>*,.sheet,#main.enter .ring-arc{animation:none}}
.done-hero{background:linear-gradient(160deg,#1E4A12 0%,#12300B 75%)!important;border:1.5px solid #97C459!important;box-shadow:0 0 22px rgba(151,196,89,.45),inset 0 0 18px rgba(151,196,89,.18)!important}
.done-ck{width:48px;height:48px;border-radius:50%;background:#97C459;color:#12300B;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 16px rgba(151,196,89,.7)}.done-ck svg{width:28px;height:28px;stroke-width:3}
</style>

<script>
"use strict";
/* ---------- utility ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ds(new Date());
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const dIdx=s=>(pd(s).getDay()+6)%7;
const monday=s=>addD(s,-dIdx(s));
const diffD=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const GG=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const GGL=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const MM=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const fmt=s=>{const d=pd(s);return d.getDate()+' '+MM[d.getMonth()]};
const SPORTS={calcio:['Calcio','calcio',1,0,1],calcetto:['Calcetto','calcetto',1,0,1],basket:['Basket','basket',1,0,1],pallavolo:['Pallavolo','pallavolo',1,1,1],tennis:['Tennis / padel','tennis',1,1,1],corsa:['Corsa','corsa',1,0,0],ciclismo:['Ciclismo','bici',1,0,0],nuoto:['Nuoto','nuoto',0,1,0],arti:['Arti marziali / boxe','allenamento',1,1,1],palestra:['Palestra / pesi','palestra',1,1,0],altro:['Altro sport','sport',1,0,0],nessuno:['Nessuno sport','sport',0,0,0]};
const JOBS={autista:['Autista / alla guida','Pausa autista',1],ufficio:['Ufficio / scrivania','Pausa scrivania',1],studente:['Studente','Pausa studio',1],piedi:['In piedi (negozio, sala…)','Pausa in piedi',2],fisico:['Lavoro fisico pesante','Pausa scarico',3],casa:['Casa / altro','Pausa attiva',1]};
const SP=()=>{const k=(typeof S!=='undefined'&&S.sport)||'nessuno';const a=SPORTS[k]||SPORTS.nessuno;return{k,n:a[0],w:a[1],legs:!!a[2],upper:!!a[3],speed:!!a[4],none:k==='nessuno'}};
const JB=()=>{const k=(typeof S!=='undefined'&&S.job)||'casa';const a=JOBS[k]||JOBS.casa;return{k,n:a[0],pause:a[1],kind:a[2]}};
const cap1=t=>t.charAt(0).toUpperCase()+t.slice(1);
const G=(m,f)=>(typeof S!=='undefined'&&S.sex==='f')?f:m;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mmss=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+pad(s%60)};
function seeded(seed){let s=0;for(const c of String(seed))s=(s*31+c.charCodeAt(0))%2147483647;return()=>{s=(s*16807)%2147483647;return s/2147483647}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- icone (tabler outline, inline) ---------- */
const P={
home:'<path d="M5 12l-2 0l9 -9l9 9l-2 0"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7"/><path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6"/>',
cal:'<path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12z"/><path d="M16 3v4"/><path d="M8 3v4"/><path d="M4 11h16"/>',
list:'<path d="M9 6l11 0"/><path d="M9 12l11 0"/><path d="M9 18l11 0"/><path d="M5 6l0 .01"/><path d="M5 12l0 .01"/><path d="M5 18l0 .01"/>',

const MUS={au:null,gain:null,src:null,ids:[],i:0,on:false,url:null,ducked:false,dt:null,
 vol(){return (S.set.mvol!=null?S.set.mvol:0.6)},
 ensure(){if(this.au)return;unlockAudio();this.au=new Audio();this.au.preload='auto';this.au.setAttribute('playsinline','');this.au.onended=()=>this.next();
  try{if(AC){this.src=AC.createMediaElementSource(this.au);this.gain=AC.createGain();this.gain.gain.value=this.vol();this.src.connect(this.gain);this.gain.connect(AC.destination)}}catch(e){this.gain=null}},
 setG(v,t=0.25){if(this.gain&&AC){const g=this.gain.gain,n=AC.currentTime;g.cancelScheduledValues(n);g.setValueAtTime(g.value,n);g.linearRampToValueAtTime(v,n+t)}else if(this.au)try{this.au.volume=v}catch(e){}},
 duck(on,ms){if(!this.on)return;clearTimeout(this.dt);if(on){this.ducked=true;this.setG(this.vol()*0.18,0.2);if(ms)this.dt=setTimeout(()=>this.duck(false),ms)}else{this.ducked=false;this.setG(this.vol(),0.6)}},
 async start(){const l=await MDB.list();if(!l.length){musicSheet();return false}this.ensure();try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  this.ids=l.map(x=>x.id).sort(()=>Math.random()-0.5);this.i=0;this.on=true;await this.load();this.emit();return true},
 async load(){const it=await MDB.get(this.ids[this.i]);if(!it)return;if(this.url)URL.revokeObjectURL(this.url);this.url=URL.createObjectURL(it.blob);this.au.src=this.url;this.cur=it.n;this.setG(this.ducked?this.vol()*0.18:this.vol(),0.05);try{await this.au.play()}catch(e){toast('Tocca di nuovo ♪ per far partire la musica')}this.emit()},
 next(){if(!this.on||!this.ids.length)return;this.i=(this.i+1)%this.ids.length;this.load()},
 stop(){this.on=false;try{this.au&&this.au.pause()}catch(e){}this.emit()},
 toggle(){if(this.on)this.stop();else this.start()},
 subs:[],emit(){this.subs=this.subs.filter(f=>{try{return f()!==false}catch(e){return false}})}};

  const q=x=>el.querySelector(x);

function shortify(st){const keepW=new Set();const ex=[];let warm=0;st.forEach((x,i)=>{if(x.type!=='work'&&x.type!=='set')return;if(x.phase==='warm'){if(warm<2){keepW.add(i);warm++}return}if(x.phase!=='main'||/^Velocità/.test(x.label||''))return;const id=x.ex.id;if(!ex.includes(id)){if(ex.length>=3)return;ex.push(id)}const n=[...keepW].filter(j=>st[j].ex.id===id&&st[j].phase==='main').length;if(n<2)keepW.add(i)});
 const out=[];st.forEach((x,i)=>{if(keepW.has(i)){let j=i-1;const pre=[];while(j>=0&&st[j].type!=='work'&&st[j].type!=='set'){pre.unshift(st[j]);j--}out.push(...pre,x)}});return out}
function noJumps(st){if(confFor('jump')!==0)return st;const J=['jumpsquat','pogo','atterraggio'];const o=[];st.forEach(x=>{if(x.ex&&J.includes(x.ex.id)&&(x.type==='work'||x.type==='set'))return;o.push(x)});return o.filter((x,i)=>!((x.type==='rest'||x.type==='switch')&&o[i+1]&&(o[i+1].type==='rest'||o[i+1].type==='switch')))}

function buildPlan(pl){const eq=LOCS[S.loc].eq,steps=[],skipped=[];
 let wu=['skip','circ','rematore','hinge'].map(i=>EXM[i]).filter(e=>!blocked(e)).slice(0,2);if(pl.items.every(([id])=>groupsOf(EXM[id]||{id:''}).includes('mobilita')))wu=[];
 wu.forEach((e,i)=>{steps.push({type:'switch',ex:e,secs:5});steps.push({type:'work',ex:e,secs:30,label:'Riscaldamento · '+(i+1)+'/'+wu.length,phase:'warm'})});
 pl.items.forEach(([id,sets,amt,rest])=>{const e=EXM[id];if(!e)return;if(!e.req.every(r=>eq.includes(r))||blocked(e)){skipped.push(e.n);return}
  const kg=e.bag==='hand'?3:0;const ll=lastLog('x-'+e.id,e.id);
  for(let k=1;k<=sets;k++){steps.push({type:'rest',secs:k===1?10:rest,ex:e,kg});
   if(e.mode==='reps')steps.push({type:'set',ex:e,slot:'x-'+e.id,sn:e.n,setNo:k,sets,kg,lvl:0,nl:1,fixed:true,range:[Math.max(1,amt-3),amt],prog:false,last:ll&&ll.reps[k-1]!=null?ll.reps[k-1]:null,secs:45,phase:'main'});
   else steps.push({type:'work',ex:e,secs:amt*(e.side?2:1),label:e.n+' · serie '+k+'/'+sets,phase:'main'})}});
 return{steps,skipped}}
function startPlan(pl){const {steps,skipped}=buildPlan(pl);if(!steps.some(x=>x.phase==='main')){toast('Nessun esercizio fattibile qui: cambia luogo o attrezzi');return}
 if(skipped.length)toast('Saltati qui: '+skipped.join(', '));startPlayer(steps,{kind:'massa',focus:'plan',title:pl.n})}

const HARDER=Object.fromEntries(Object.entries(EASIER).map(([a,b])=>[b,a]));

 o.forEach(x=>{if(x.ex&&E.sw[x.ex.id]&&EXM[E.sw[x.ex.id]]){const n=EXM[E.sw[x.ex.id]];const sl=MASS.find(m=>m.id===x.slot);x.ex=n;if(x.type==='set'){x.last=null;x.kg=0;if(!sl||!sl.lad.includes(n.id)){x.fixed=true;x.prog=false}else{x.lvl=sl.lad.indexOf(n.id)}}if(x.type==='work'&&x.reps!=null&&n.mode!=='reps'){x.reps=0;x.secs=workSecs(n)}}});
 o=o.filter(x=>!(x.ex&&isM(x)&&E.rm.includes(x.ex.id)));
 Object.entries(E.ds).forEach(([id,d])=>{if(!d)return;const idx=o.map((x,i)=>isM(x)&&x.ex.id===id?i:-1).filter(i=>i>=0);if(!idx.length)return;
  if(d<0){idx.slice(Math.max(1,idx.length+d)).reverse().forEach(i=>{o.splice(i,1);if(o[i-1]&&o[i-1].type==='rest')o.splice(i-1,1)})}
  else{const last=idx[idx.length-1];const add=[];for(let k=0;k<d;k++){add.push({type:'rest',secs:o[last-1]&&o[last-1].type==='rest'&&o[last-1].secs>12?o[last-1].secs:45,ex:o[last].ex},{...o[last]})}o.splice(last+1,0,...add)}});
 if(E.add.length){let at=o.map((x,i)=>isM(x)?i:-1).filter(i=>i>=0).pop();at=at==null?o.length:at+1;const ins=[];
  E.add.forEach(([id,sets,amt])=>{const e=EXM[id];if(!e)return;ins.push({type:'switch',ex:e,secs:6});for(let k=1;k<=sets;k++){ins.push({type:'rest',secs:k===1?8:45,ex:e});
   if(e.mode==='reps')ins.push({type:'set',ex:e,slot:'x-'+e.id,sn:e.n,setNo:k,sets,kg:0,lvl:0,nl:1,fixed:true,range:[Math.max(1,amt-2),amt],prog:false,last:(lastLog('x-'+e.id,e.id)||{reps:[]}).reps[k-1]??null,secs:45,phase:'main'});
   else ins.push({type:'work',ex:e,secs:amt*(e.side?2:1),label:e.n+' · serie '+k+'/'+sets,phase:'main',reps:0})}});o.splice(at,0,...ins)}
 o=tidy(o);const cnt={},tot={};o.forEach(x=>{if(isM(x)&&x.type==='set'){tot[x.ex.id]=(tot[x.ex.id]||0)+1}});o.forEach(x=>{if(isM(x)&&x.type==='set'){cnt[x.ex.id]=(cnt[x.ex.id]||0)+1;x.setNo=cnt[x.ex.id];x.sets=tot[x.ex.id]}});
 const wc={},wt={};o.forEach(x=>{if(isM(x)&&x.type==='work')wt[x.ex.id]=(wt[x.ex.id]||0)+1});o.forEach(x=>{if(isM(x)&&x.type==='work'&&wt[x.ex.id]>1){wc[x.ex.id]=(wc[x.ex.id]||0)+1;x.label=(x.label||'').replace(/serie \d+\/\d+/,'serie '+wc[x.ex.id]+'/'+wt[x.ex.id])}});

function lineChart(pts,unit){

 const W=300,H=140,pl=34,pr=10,pt=12,pb=22;const ys=pts.map(p=>p.v);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1}const padv=(mx-mn)*0.15;mn-=padv;mx+=padv;
 const x=i=>pl+(W-pl-pr)*i/(pts.length-1),y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
 const grid=[mn,(mn+mx)/2,mx].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#3A2860"/><text x="${pl-4}" y="${y(v)+4}" fill="#8A7AAA" font-size="10" text-anchor="end">${Math.round(v*10)/10}</text>`).join('');

 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">${grid}<path d="${path}" fill="none" stroke="#FDB927" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="#FDB927"/>`).join('')}${lab}</svg>`;
}

  sheet(`<h2 style="margin-top:0">Che foto è?</h2><img src="${data}" style="width:100%;border-radius:12px;max-height:40vh;object-fit:contain"><div class="seg" style="margin-top:10px"><button data-v="Fronte" class="on">Fronte</button><button data-v="Lato">Lato</button><button data-v="Dietro">Dietro</button></div><div style="height:12px"></div><button class="btn" id="phs2">Salva foto</button>`,(el,close)=>{let v='Fronte';el.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{v=b.dataset.v;el.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on',x===b))});
   el.querySelector('#phs2').onclick=async()=>{const ok=await IDB.put({id:uid(),date:today(),view:v,data});close();toast(ok?'Foto salvata':'Non posso salvare foto in questo browser');loadPhotos()}})};
 loadPhotos();
}
const BODYSVG_M=`<svg viewBox="0 0 110 200" id="bsvg"><ellipse cx="55" cy="18" rx="11" ry="13" fill="#ECE4F7"/><rect x="49" y="29" width="12" height="9" fill="#ECE4F7"/><path d="M30 40 Q55 34 80 40 L76 92 Q55 98 34 92 Z" fill="#ECE4F7"/><path d="M30 41 Q20 44 18 60 L14 100 L21 101 L27 64 Z" fill="#D9CCEF"/><path d="M80 41 Q90 44 92 60 L96 100 L89 101 L83 64 Z" fill="#D9CCEF"/><path d="M34 92 Q55 99 76 92 L74 112 L57 114 L53 114 L36 112 Z" fill="#C9B8E6"/><path d="M36 110 L53 113 L50 155 L48 190 L39 190 L38 155 Z" fill="#ECE4F7"/><path d="M74 110 L57 113 L60 155 L62 190 L71 190 L72 155 Z" fill="#ECE4F7"/>
<g stroke="#FDB927" stroke-width="3" id="mlines" opacity="1"><line data-k="collo" x1="47" y1="33" x2="63" y2="33"/><line data-k="spalle" x1="24" y1="43" x2="86" y2="43"/><line data-k="petto" x1="28" y1="54" x2="82" y2="54"/><line data-k="braccio" x1="14" y1="58" x2="29" y2="58"/><line data-k="avambraccio" x1="14" y1="82" x2="23" y2="82"/><line data-k="vita" x1="33" y1="82" x2="77" y2="82"/><line data-k="fianchi" x1="34" y1="104" x2="76" y2="104"/><line data-k="coscia" x1="37" y1="128" x2="53" y2="128"/><line data-k="polpaccio" x1="38" y1="166" x2="50" y2="166"/></g></svg>`;
function bodySvg(){if(S.sex!=='f')return BODYSVG_M;return BODYSVG_M.replace('<path d="M30 40 Q55 34 80 40 L76 92 Q55 98 34 92 Z" fill="#ECE4F7"/>','<path d="M33 40 Q55 35 77 40 L72 70 Q71 80 78 94 Q55 100 32 94 Q39 80 38 70 Z" fill="#ECE4F7"/>').replace('<ellipse cx="55" cy="18" rx="11" ry="13" fill="#ECE4F7"/>','<path d="M44 16 Q44 4 55 4 Q67 4 67 18 L70 34 Q62 30 60 26 L50 26 Q48 30 40 34 Z" fill="#4A3670"/><ellipse cx="55" cy="18" rx="10" ry="12" fill="#ECE4F7"/><path d="M45 14 Q47 5 55 5 Q64 5 66 14 Q58 9 45 14Z" fill="#4A3670"/>')}
function hlMeas(k){document.querySelectorAll('#mlines line').forEach(l=>{l.style.display=l.dataset.k===k?'':'none'})}
async function loadPhotos(){const el=$('#phs');if(!el)return;const all=(await IDB.all()).sort((a,b)=>b.date.localeCompare(a.date));if(!$('#phs'))return;
 el.innerHTML=all.length?all.map(p=>`<button data-p="${p.id}" style="border:0;padding:0;background:none;color:var(--tx);text-align:left"><img src="${p.data}" alt="Foto ${esc(p.view)}"><div class="small dim">${fmt(p.date)} · ${esc(p.view)}</div></button>`).join(''):'<div class="empty" style="grid-column:1/-1">Nessuna foto.</div>';
 el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=all.find(x=>x.id===b.dataset.p);sheet(`<img src="${p.data}" style="width:100%;border-radius:12px"><div class="row between" style="margin-top:10px"><span class="mu">${fmt(p.date)} · ${esc(p.view)}</span><button class="chip" id="pdel">${I('trash')} Elimina</button></div>`,(s,close)=>{s.querySelector('#pdel').onclick=async()=>{await IDB.del(p.id);close();loadPhotos()}})})}
function shrink(file){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,900/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);try{r(c.toDataURL('image/jpeg',0.75))}catch(e){r(null)}};img.onerror=()=>r(null);img.src=fr.result};fr.onerror=()=>r(null);fr.readAsDataURL(file)})}
function measForm(){
 const last=S.meas.slice().sort((a,b)=>a.date.localeCompare(b.date)).pop()||{};
 sheet(`<h2 style="margin-top:0">Nuova misura</h2><label>Data</label><input type="date" id="md" value="${today()}">
 <div>${MEAS.map(([k,n,u,h])=>`<div style="margin-top:12px"><div class="row" style="gap:10px"><label style="margin:0;flex:1;font-size:15px;color:var(--tx)">${n} <span class="dim">(${u})</span></label><input type="number" inputmode="decimal" step="0.1" id="m_${k}" style="width:110px;text-align:center" placeholder="${last[k]!=null?String(last[k]).replace('.',','):''}"></div><div class="hint">${esc(h)}</div></div>`).join('')}</div>
 <p class="small dim">Compila solo quello che vuoi: puoi lasciare vuote le altre.</p><button class="btn" id="msave">Salva misure</button>`,(el,close)=>{
  el.querySelector('#msave').onclick=()=>{const o={id:uid(),date:el.querySelector('#md').value||today()};let any=false;MEAS.forEach(([k])=>{const v=el.querySelector('#m_'+k).value.replace(',','.');if(v!==''&&!isNaN(+v)){o[k]=+v;any=true}});if(!any){toast('Inserisci almeno una misura');return}
   S.meas.push(o);save();const nm=checkMedals();close();render();toast(nm.length?'Nuova medaglia: '+nm.join(', '):'Misure salvate')}});
}

/* ---------- IMPOSTAZIONI ---------- */
function importSheet(){sheet(`<h2 style="margin-top:0">Importa backup</h2><p class="small mu">Nell'altra versione dell'app: Impostazioni → Copia backup. Poi incolla qui.</p><textarea id="bt" rows="6" placeholder="Incolla qui il testo del backup"></textarea><div style="height:10px"></div><button class="btn" id="bgo">Importa</button>`,(e2,c2)=>{e2.querySelector('#bgo').onclick=()=>{try{const o=JSON.parse(e2.querySelector('#bt').value);if(!o||!o.name)throw 0;S={...DEF(),...o};migrateLocs();save();c2();render();toast('Backup importato')}catch(x){toast('Testo del backup non valido')}}})}
function settings(){
 sheet(`<h2 style="margin-top:0">Impostazioni</h2>
 <label>Nome</label><input id="sn" value="${esc(S.name)}">
 <label>Profilo</label><div class="seg" id="ssx"><button data-x="m" class="${S.sex!=='f'?'on':''}">Uomo</button><button data-x="f" class="${S.sex==='f'?'on':''}">Donna</button></div>
 <label>Voce del coach</label><div class="seg" id="svx"><button data-v="f" class="${(S.set.vsex||'f')==='f'?'on':''}">Femminile</button><button data-v="m" class="${S.set.vsex==='m'?'on':''}">Maschile</button></div><div class="hint">Dipende dalle voci italiane installate sul telefono.</div><button class="btn sec" id="svtest" style="margin-top:6px">${I('vol')} Prova la voce</button><div class="hint">Non senti niente? Su iPhone togli il silenzioso (l'interruttore a lato) e alza il volume: in silenzioso Safari spegne la voce e i beep.</div>
 <label>Quanto ti senti sicuro</label><button class="btn sec" id="scfg">${I('target')} Per gruppo di esercizi</button>
 <label>Recuperi tra le serie</label><div class="seg" id="srs">${[['brevi','Brevi'],['normali','Normali'],['lunghi','Lunghi']].map(([k,n])=>`<button data-rs="${k}" class="${(S.set.rest||'brevi')===k?'on':''}">${n}</button>`).join('')}</div>
 <label>Pausa per cambiare esercizio</label><div class="seg" id="schg">${[15,30,45].map(v=>`<button data-chg="${v}" class="${(S.set.chg||30)===v?'on':''}">${v}″</button>`).join('')}</div>
 <label>Postura</label><button class="btn sec" id="spost">${I('heart')} Postura e schiena${S.set.postAdd?' · aggiunta alle sessioni':''}</button>
 <label>Musica di sottofondo</label><button class="btn sec" id="smus">♪ Le mie canzoni</button>
 <label>Ritmo dell'omino</label><div class="seg" id="spc">${Object.entries(PACES).map(([k,v])=>`<button data-pc="${k}" class="${(S.set.pace||'lento')===k?'on':''}">${v[1][0].toUpperCase()+v[1].slice(1)}</button>`).join('')}</div>
 <label>Livello</label><div class="seg" id="slv">${['Principiante','Intermedio','Avanzato'].map((n,i)=>`<button data-l="${i+1}" class="${S.level===i+1?'on':''}">${n}</button>`).join('')}</div>
 <label>Sport e lavoro</label><button class="btn sec" id="sprof">${esc(SP().n)} · ${esc(JB().n)}</button>
 <label>Fascia cardio</label><button class="btn sec" id="shr">${I('heart')} ${HR.ch?esc(S.hrName||'Collegata'):S.hrName?esc(S.hrName)+' · non collegata':'Collega una fascia cardio'}</button>
 <label>Programma di 8 settimane</label><button class="btn sec" id="srst">${I('refresh')} Ricomincia dalla settimana 1 · ora sei alla ${progWeek()}</button>
 <label>Luoghi e attrezzi</label><button class="btn sec" id="sloc">${I('pin')} I tuoi luoghi (${S.locs.length})</button>
 <label>Dimensione del testo</label><div class="seg" id="sfk">${[[1,'Normale'],[1.12,'Grande'],[1.25,'Molto grande']].map(([k,n])=>`<button data-fk="${k}" class="${(S.fontK||1)===k?'on':''}">${n}</button>`).join('')}</div>
 <button class="btn ghost" id="stour" style="margin-top:10px">${I('info')} Guida dell'app</button>
 <label>Avvisi del timer</label><div class="chips"><button class="chip ${S.set.sound?'on':''}" id="ss">Beep</button><button class="chip ${S.set.vib?'on':''}" id="sv">Vibrazione</button><button class="chip ${S.set.voice!==false?'on':''}" id="svo">Voce del coach</button></div>
 <div class="hint">La vibrazione funziona su Android; su iPhone il browser non la permette, resta il beep.</div>
 <label>Programma</label><div class="small mu">Settimana ${progWeek()} di 8 · ${phaseOf().n} (dal ${fmt(S.start)})</div><button class="btn ghost" id="srest" style="margin-top:6px">Ricomincia il programma dalla settimana 1</button>
 <label>Salvataggio</label><div class="small mu">${syncState==='cloud'?'Sul telefono e nel tuo spazio privato dell\'account Claude: ritrovi i dati anche su un altro dispositivo.':'Solo su questo telefono.'} Le foto restano solo sul telefono.</div>
 <div class="grid2" style="margin-top:8px"><button class="btn sec" id="bfile">Salva backup</button><button class="btn sec" id="bload">Ripristina</button></div>
 <label class="row" style="gap:8px;margin-top:6px"><input type="checkbox" id="bph" style="width:auto"> Includi le foto (file più grande)</label>
 <div class="grid2" style="margin-top:8px"><button class="btn ghost" id="bcopy">${I('copy')} Copia come testo</button><button class="btn ghost" id="bimp">Incolla testo</button></div><input type="file" id="bfin" accept=".json,application/json,text/plain" style="display:none">
 <div style="height:14px"></div><button class="btn" id="ssave">Salva</button>
 <button class="btn danger" id="sreset" style="margin-top:20px">Cancella tutti i dati</button>`,(el,close)=>{
  let lv=S.level,sx=S.sex||'m';el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{sx=b.dataset.x;el.querySelectorAll('[data-x]').forEach(x=>x.classList.toggle('on',x===b))});
  el.querySelector('#svtest').onclick=()=>{unlockAudio();beep(880,0.15);COACH.prime();setTimeout(()=>COACH.say('Ciao! Se mi senti, la voce funziona.',true),700)};
  el.querySelector('#scfg').onclick=()=>{close();confSheet()};
  el.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{S.set.rest=b.dataset.rs;save();el.querySelectorAll('[data-rs]').forEach(x=>x.classList.toggle('on',x===b))});
  el.querySelectorAll('[data-chg]').forEach(b=>b.onclick=()=>{S.set.chg=+b.dataset.chg;save();el.querySelectorAll('[data-chg]').forEach(x=>x.classList.toggle('on',x===b))});
  el.querySelector('#spost').onclick=()=>{close();postSheet()};
  el.querySelector('#smus').onclick=()=>{close();musicSheet()};
  el.querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>{S.set.pace=b.dataset.pc;save();el.querySelectorAll('[data-pc]').forEach(x=>x.classList.toggle('on',x===b));toast('Ritmo '+PACES[S.set.pace][1])});
  el.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.set.vsex=b.dataset.v;COACH.v=null;COACH.pick();el.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on',x===b));COACH.say(S.set.vsex==='f'?'Ciao, sono la tua coach!':'Ciao, sono il tuo coach!',true)});el.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lv=+b.dataset.l;el.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('on',x===b))});
  el.querySelector('#ss').onclick=e=>{S.set.sound=!S.set.sound;e.currentTarget.classList.toggle('on',S.set.sound);if(S.set.sound)beep()};
  el.querySelectorAll('[data-fk]').forEach(b=>b.onclick=()=>{S.fontK=+b.dataset.fk;save();applyFont();el.querySelectorAll('[data-fk]').forEach(x=>x.classList.toggle('on',x===b))});
  el.querySelector('#stour').onclick=()=>{close();tour()};
  el.querySelector('#sloc').onclick=()=>{close();placesSheet()};
  el.querySelector('#srst').onclick=()=>confirmBox('Ricominciare il programma da oggi? Lo storico degli allenamenti resta.','Ricomincia',()=>{S.start=monday(today());save();close();render();toast('Programma ripartito: settimana 1 di 8')});
  el.querySelector('#shr').onclick=()=>{close();HR.ok()?hrSheet():hrHelp()};
  el.querySelector('#sprof').onclick=()=>{close();const L=openLayer(()=>render());profileSetup($('#main'),false,ok=>{closeLayer(L);render();if(ok)toast('Profilo aggiornato')})};
  el.querySelector('#sv').onclick=e=>{S.set.vib=!S.set.vib;e.currentTarget.classList.toggle('on',S.set.vib);vib(100)};
  el.querySelector('#svo').onclick=e=>{S.set.voice=S.set.voice===false;e.currentTarget.classList.toggle('on',S.set.voice!==false);if(S.set.voice!==false)COACH.say('Ciao! Sono il tuo coach. Spingiamo!',true)};
  el.querySelector('#srest').onclick=()=>{S.start=today();save();toast('Programma ripartito dalla settimana 1')};
  el.querySelector('#bfile').onclick=async()=>{const data={app:'showtimefit',v:1,date:today(),S};if(el.querySelector('#bph').checked)data.photos=await IDB.all();const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const name='showtime-backup-'+today()+'.json';
   try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Backup Showtime Fit'});return}}catch(e){if(e&&e.name==='AbortError')return}
   if(CAM_OK){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),3000);toast('Backup salvato nei download')}else toast('Qui usa "Copia come testo"')};
  el.querySelector('#bload').onclick=()=>el.querySelector('#bfin').click();
  el.querySelector('#bfin').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=async()=>{try{let o=JSON.parse(fr.result);const ph=o.photos;if(o.app==='showtimefit')o=o.S;if(!o||!o.name)throw 0;S={...DEF(),...o};migrateLocs();save();if(ph&&ph.length){for(const x of ph)await IDB.put(x)}close();render();toast('Backup ripristinato'+(ph&&ph.length?' con '+ph.length+' foto':''))}catch(e){toast('File di backup non valido')}};fr.readAsText(f)};
  el.querySelector('#bcopy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S));toast('Backup copiato: incollalo in una nota per conservarlo')}catch(e){toast('Copia non riuscita su questo browser')}};
  el.querySelector('#bimp').onclick=()=>{close();importSheet()};
  el.querySelector('#ssave').onclick=()=>{const n=el.querySelector('#sn').value.trim();if(n)S.name=n;S.level=lv;S.sex=sx;save();close();render();toast('Impostazioni salvate')};
  el.querySelector('#sreset').onclick=()=>{close();confirmBox('Cancellare tutti i dati? Non si può annullare.','Cancella tutto',()=>{S=DEF();save();render()})};
 });
}

render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script><script>
(function askConf(n){if(S.confG||!S.name)return;if(document.querySelector('.sheet-bg')||(typeof PL!=='undefined'&&PL)){if(n<40)setTimeout(()=>askConf(n+1),1500);return}setTimeout(()=>{if(!S.confG&&!document.querySelector('.sheet-bg'))confSheet()},400)})(0);
</script>
